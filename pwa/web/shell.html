<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f3f4" />
    <meta name="description" content="Oglum Scam Club — WellPass check-in, runs locally on your phone" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OSC" />
    <title>Oglum Scam Club</title>
    @@ICONS@@
    <script>
      // The page installs on its own: the manifest is built at runtime (absolute URLs need the real
      // address) and icons are embedded, so index.html works without any sibling file.
      (function () {
        if (!/^https?:$/.test(location.protocol)) return
        var start = location.origin + location.pathname
        var manifest = {
          name: 'Oglum Scam Club',
          short_name: 'OSC',
          description: 'WellPass check-in screen that runs locally on your phone.',
          lang: 'en',
          id: start,
          start_url: start,
          scope: start.slice(0, start.lastIndexOf('/') + 1),
          display: 'standalone',
          orientation: 'portrait',
          background_color: '#060404',
          theme_color: '#f2f3f4',
          icons: @@MANIFEST_ICONS@@
        }
        var link = document.createElement('link')
        link.rel = 'manifest'
        link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }))
        document.head.appendChild(link)
      })()
    </script>
    <style>@@STYLE@@</style>
  </head>
  <body>
    <main id="root"></main>

  <script id="wp-modules" type="application/json">@@MODULES@@</script>
  <script>
    // No server here: modules are served from Blob URLs and routes live in the hash.
    (function () {
      var sources = JSON.parse(document.getElementById('wp-modules').textContent)
      var urls = {}
      function resolve(from, spec) {
        var parts = from.split('/')
        parts.pop()
        spec.split('/').forEach(function (part) {
          if (part === '.' || part === '') return
          if (part === '..') parts.pop()
          else parts.push(part)
        })
        return parts.join('/')
      }
      function url(name) {
        if (urls[name]) return urls[name]
        var body = sources[name]
        if (body == null) throw new Error('Module missing: ' + name)
        body = body.replace(/from\s+'([^']+)'/g, function (_, spec) {
          return "from '" + url(resolve(name, spec)) + "'"
        })
        return (urls[name] = URL.createObjectURL(new Blob([body], { type: 'text/javascript' })))
      }
      window.__WELLPASS_SINGLE_FILE__ = true
      import(url('main.js')).catch(function (error) {
        console.error(error)
        document.getElementById('root').textContent =
          'App could not be loaded: ' + (error && error.message ? error.message : error)
      })
    })()
  </script>
  </body>
</html>
