    <style>
/* Design tokens — 1:1 port of ios/OSCwellPassPoC/Theme.swift (live light + html blocks). */
:root {
  /* light UI — Home + Check-in */
  --page-light: #f6f6f6;
  --light-bg: #fbfafa;
  --hairline: #e4e4e4;
  --home-bg: #f2f3f4;
  --card-bg: #ffffff;
  --card-stroke: #e8e8e8;
  --nav-grey: #757575;
  --headline-teal: #2c6e73;
  --name-dark: #2a2a2a;
  --meta-grey: #9a9a9a;
  --arc-teal: #4e828d;
  --arc-wash: #eef1f4;
  --photo-placeholder: #e7eff0;
  --ring-sage: #b7c0ba;
  --ring-green: #8fb79b;
  --line-teal: #48727c;

  /* semantic aliases used by the views */
  --danger: #e5484d;
  --focus-ring: rgba(44, 110, 115, 0.45);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
}

html {
  background: var(--home-bg);
  -webkit-text-size-adjust: 100%;
  /* Home-screen app feel: nothing may be panned sideways and nothing bounces. */
  overflow-x: clip;
  overscroll-behavior: none;
}

body {
  min-height: 100%;
  background: var(--home-bg);
  color: var(--name-dark);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-synthesis: weight;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: clip;
  overscroll-behavior: none;
  /* pan-y + pinch-zoom: no sideways drag, no rubber-band, no double-tap zoom. */
  touch-action: pan-y pinch-zoom;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

/* Text entry still needs selection + the native caret/menu. */
input,
textarea,
select,
[contenteditable="true"] {
  -webkit-user-select: text;
  user-select: text;
  -webkit-touch-callout: default;
}

#root {
  min-height: 100%;
}

/* Screen stage: one layer per mounted view. Both layers coexist only while a
   transition runs (router.js), so the sideways push has something to slide over. */
.screen-stage {
  position: relative;
  min-height: 100dvh;
  /* Clip the incoming layer at the screen edge without becoming a scroll box —
     vertical scrolling stays on the document. */
  overflow-x: clip;
}

.screen-layer {
  position: relative;
  min-height: 100dvh;
  background: var(--home-bg);
}

.screen-layer.is-outgoing {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  pointer-events: none;
}

/* UIKit-style dim that follows the screen being covered/revealed. */
.layer-dim {
  position: absolute;
  inset: 0;
  background: #000;
  opacity: 0;
  pointer-events: none;
}

.screen {
  min-height: 100dvh;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* Horizontal strips (category chips) keep their own pan gesture. */
[data-touch-pan-x] {
  touch-action: pan-x;
}

.icon {
  display: block;
  flex: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

:focus-visible {
  outline: 2px solid var(--headline-teal);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.001ms !important;
  }
}

#home {
  background: var(--home-bg);
  color: var(--name-dark);
}

.chrome-spacer {
  height: 64px;
}

.home-scroll {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 8px 20px 32px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.home-header {
  padding-top: 42px;
  padding-bottom: 10px;
  min-height: 44px;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  text-align: center;
}

.home-title {
  margin: 0;
  font-size: 30px;
  line-height: 1.12;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--headline-teal);
}

.home-subtitle {
  margin: 4px 0 0;
  font-size: 13.5px;
  line-height: 1.2;
  color: var(--meta-grey);
}

.card {
  background: var(--card-bg);
  border: 1px solid var(--card-stroke);
  border-radius: 16px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
}

/* Install hint ------------------------------------------------------------ */
.install-card {
  overflow: hidden;
  border-color: rgba(44, 110, 115, 0.22);
  background: linear-gradient(180deg, #ffffff 0%, #f7fafb 100%);
}

.install-head {
  width: 100%;
  padding: 12px 14px;
  border: 0;
  background: transparent;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  color: inherit;
  font: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.install-copy {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.install-title {
  font-size: 14.5px;
  line-height: 1.2;
  font-weight: 700;
  color: var(--headline-teal);
}

.install-sub {
  font-size: 12.5px;
  line-height: 1.2;
  color: var(--meta-grey);
}

.install-chevron {
  margin-left: auto;
  display: grid;
  place-items: center;
  color: var(--meta-grey);
}

.install-body {
  padding: 0 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.install-body[hidden] {
  display: none;
}

.install-lead {
  margin: 0;
  font-size: 13px;
  line-height: 1.35;
  color: var(--nav-grey);
}

.install-steps {
  margin: 2px 0 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.install-steps li {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 13.5px;
  line-height: 1.35;
  color: var(--name-dark);
}

.install-steps b {
  font-weight: 600;
}

.install-steps svg {
  display: inline-block;
  vertical-align: -2px;
  color: var(--headline-teal);
}

.install-num {
  flex: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--arc-wash);
  color: var(--headline-teal);
  font-size: 11px;
  font-weight: 700;
  line-height: 18px;
  text-align: center;

dialog {

/* Check-in ----------------------------------------------------------------------
   Uses a 9:16 stage as tall as the screen,
   and every size/position below is a fraction of the screen height --H. The stage holds the static
   artwork (checkin-backdrop.js); .ci-overlay holds the dynamic parts, centred on the full screen width. */
#checkin {
  --H: 100dvh;
  --pulse-scale: 1.5;
  position: relative;
  width: 100%;
  height: var(--H);
  padding: 0;
  overflow: hidden;
  background: #f3f3f3;
}

.ci-stage {
  position: absolute;
  top: 0;
  left: 50%;
  width: calc(var(--H) * 9 / 16);
  height: var(--H);
  transform: translateX(-50%);
}

.ci-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}

.ci-back {
  position: absolute;
  left: calc(16.97% - var(--H) * 0.035);
  top: calc(8.72% - var(--H) * 0.035);
  width: calc(var(--H) * 0.07);
  height: calc(var(--H) * 0.07);
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.ci-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.ci-pulse,
.ci-avatar {
  position: absolute;
  top: calc(var(--H) * 0.3294);
  left: 50%;
  width: calc(var(--H) * 0.2305);
  height: calc(var(--H) * 0.2305);
  margin-left: calc(var(--H) * -0.11525);
  border-radius: 50%;
}

/* Two linear expand-and-fade pulses (400 ms each), then an 800 ms pause; 1600 ms loop. Same stops as the
   Pulse interpolation: scale 1→S / 1→S / 1, opacity .5→0 / 1→0 / .5. */
.ci-pulse {
  background: #1e7048;
  opacity: 0.5;
  will-change: transform, opacity;
  animation: ci-pulse 1600ms linear infinite;
}

.ci-avatar {
  display: grid;
  place-items: center;
  overflow: hidden;
  background: #b9d3d6;
}

.ci-initials {
  font-size: calc(var(--H) * 0.0738);
  line-height: 1;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: #2e7882;
}

.ci-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.ci-text {
  position: absolute;
  left: 0;
  right: 0;
  /* Vertical padding (cancelled by the negative margin) keeps descenders such as "g" inside the box that
     overflow:hidden clips to. */
  margin: -0.25em 0 0;
  padding: 0.25em 4%;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
  font-weight: 600;
}

.ci-name {
  top: calc(var(--H) * 0.58);
  font-size: calc(var(--H) * 0.032);
  letter-spacing: -0.5px;
  color: #000;
}

.ci-meta {
  font-size: calc(var(--H) * 0.018);
  letter-spacing: 0.2px;
  color: #4b5563;
}

.ci-location {
  top: calc(var(--H) * 0.635);
}

.ci-activity {
  top: calc(var(--H) * 0.67);
}

.ci-datetime {
  top: calc(var(--H) * 0.705);
}

@keyframes ci-pulse {
  0% {
    transform: scale(1);
    opacity: 0.5;
  }
  24.99% {
    transform: scale(var(--pulse-scale));
    opacity: 0;
  }
  25% {
    transform: scale(1);
    opacity: 1;
  }
  49.99% {
    transform: scale(var(--pulse-scale));
    opacity: 0;
  }
  50%,
  100% {
    transform: scale(1);
    opacity: 0.5;
  }
}

@media (prefers-reduced-motion: reduce) {
  .ci-pulse {
    animation: none;
    opacity: 0;
  }
}

  <script id="wp-modules" type="application/json">{"main.js":"import { start } from './router.js'\nimport { runSelfTest, isSelfTestRequested, shouldKeepSelfTestHistory } from './selftest.js'\n\nconst root = document.getElementById('root')\nif (!root) throw new Error('#root is missing')\n\nstart(root)\n\nif (isSelfTestRequested()) {\n  runSelfTest({ keep: shouldKeepSelfTestHistory() }).catch((error) => console.error('Self-test failed:', error))\n}\n\n// Offline cache. Needs HTTPS (or localhost) and a sw.js next to the page; a lone .html still works online.\n// Modules run from Blob URLs, so the worker URL must be resolved against the page, not the module.\nif ('serviceWorker' in navigator) {\n  if (window.isSecureContext && /^https?:$/.test(location.protocol)) {\n    const register = () => {\n      const scriptURL = new URL('sw.js', document.baseURI).href\n      const scope = new URL('./', document.baseURI).href\n      navigator.serviceWorker.register(scriptURL, { scope }).catch((error) => {\n        console.info('Offline cache not available (no sw.js next to this page?):', error?.message ?? error)\n      })\n    }\n    // This module is imported after the page's own scripts, so `load` may already have fired.\n    if (document.readyState === 'complete') register()\n    else window.addEventListener('load', register)\n  } else {\n    console.info('Offline cache disabled: service workers need HTTPS or localhost.')\n  }\n}\n","router.js":"// pushState router with one popstate listener, one layer per screen, and native-feeling\n// transitions (see transition.js). The outgoing layer stays in the DOM until its\n// animation settles so the push/pop can slide both screens at once.\nimport * as home from './views/home.js'\nimport * as checkin from './views/checkin.js'\nimport { platform, runScreenTransition } from './transition.js'\n\nconst ROUTES = [\n  { pattern: /^\\/app\\/?$/, view: home, name: 'home' },\n  { pattern: /^\\/app\\/checkin\\/?$/, view: checkin, name: 'checkin' },\n]\n\n// The single-file build (`npm run build:single`) is opened from file:// and has no\n// server, so it keeps the same routes in the hash instead of the path.\nconst SINGLE_FILE = typeof window !== 'undefined' && window.__WELLPASS_SINGLE_FILE__ === true\n\nlet stage = null\nlet current = null\nlet currentLayer = null\nlet currentDepth = 0\n\nfunction currentPath() {\n  if (!SINGLE_FILE) return location.pathname\n  const hash = location.hash.replace(/^#/, '')\n  return hash.startsWith('/app') ? hash : '/app/'\n}\n\nfunction matchRoute(pathname) {\n  return ROUTES.find((route) => route.pattern.test(pathname)) ?? ROUTES[0]\n}\n\nfunction render() {\n  const route = matchRoute(currentPath())\n  const depth = ROUTES.indexOf(route)\n  const direction = depth === currentDepth ? 'cross' : depth > currentDepth ? 'forward' : 'back'\n  const outgoing = currentLayer\n\n  current?.view.unmount?.()\n  current = route\n  currentDepth = depth\n\n  const layer = document.createElement('div')\n  layer.className = 'screen-layer'\n  layer.dataset.route = route.name\n  stage.append(layer)\n  currentLayer = layer\n  route.view.mount(layer, { navigate })\n\n  if (!outgoing) return\n\n  // A push starts at the top of the new screen, like every native navigation stack.\n  if (direction === 'forward') window.scrollTo(0, 0)\n  outgoing.classList.add('is-outgoing')\n\n  runScreenTransition({ outgoing, incoming: layer, direction }).finally(() => {\n    outgoing.remove()\n  })\n}\n\nexport function navigate(url, { replace = false } = {}) {\n  const target = SINGLE_FILE ? `#${url}` : url\n  if (replace) history.replaceState({ pwa: true }, '', target)\n  else history.pushState({ pwa: true }, '', target)\n  render()\n}\n\nexport function start(root) {\n  stage = document.createElement('div')\n  stage.className = 'screen-stage'\n  root.replaceChildren(stage)\n  // Lets CSS and the verify harness know which transition flavour is active.\n  document.documentElement.dataset.platform = platform()\n  window.addEventListener('popstate', render)\n  render()\n}\n","transition.js":"// Screen transitions: iOS gets a UIKit push/pop, Android gets Material 3 shared-axis.\n//\n// Both are pure transform/opacity animations on the two stacked layers, so they run on\n// the compositor and never touch layout. The outgoing layer keeps its DOM until the\n// animation settles (its view is already unmounted, so nothing responds to taps).\n\nconst EASE_IOS = 'cubic-bezier(0.32, 0.72, 0, 1)'; // ≈ UIKit push curve since iOS 7\nconst EASE_ANDROID = 'cubic-bezier(0.2, 0, 0, 1)'; // M3 \"emphasized decelerate\"\nconst EASE_DESKTOP = 'cubic-bezier(0.4, 0, 0.2, 1)';\n\nexport function platform() {\n  const ua = typeof navigator === 'undefined' ? '' : navigator.userAgent;\n  if (/Android/i.test(ua)) return 'android';\n  if (/iPhone|iPad|iPod/i.test(ua)) return 'ios';\n  // iPadOS 13+ claims to be a Mac; a touch-capable Mac is an iPad in disguise.\n  if (/Macintosh/i.test(ua) && (navigator.maxTouchPoints ?? 0) > 1) return 'ios';\n  return 'desktop';\n}\n\nfunction prefersReducedMotion() {\n  return window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches === true;\n}\n\nconst translate = (x, y = 0) => `translate3d(${x}, ${y}, 0)`;\n\nfunction iosPlan(direction) {\n  const forward = direction !== 'back';\n  const shadow = (x) => `${x}px 0 26px -14px rgba(0, 0, 0, 0.34)`;\n  const clear = (x) => `${x}px 0 26px -14px rgba(0, 0, 0, 0)`;\n  const seam = forward ? -18 : 18;\n  return {\n    duration: 420,\n    easing: EASE_IOS,\n    incoming: [\n      { transform: translate(forward ? '100%' : '-30%'), boxShadow: shadow(seam) },\n      { transform: translate(0), boxShadow: clear(seam) },\n    ],\n    outgoing: [\n      { transform: translate(0) },\n      { transform: translate(forward ? '-30%' : '100%') },\n    ],\n    // UIKit dims the view underneath a push — and the revealed one while popping.\n    incomingDim: forward ? [0, 0] : [0.14, 0],\n    outgoingDim: forward ? [0, 0.14] : [0, 0],\n  };\n}\n\nfunction androidPlan(direction) {\n  const forward = direction !== 'back';\n  return {\n    duration: 300,\n    easing: EASE_ANDROID,\n    incoming: [\n      { transform: translate(forward ? 28 : -28), opacity: 0 },\n      { transform: translate(0), opacity: 1 },\n    ],\n    outgoing: [\n      { transform: translate(0), opacity: 1 },\n      { transform: translate(forward ? -14 : 14), opacity: 0 },\n    ],\n    incomingDim: [0, 0],\n    outgoingDim: [0, 0],\n  };\n}\n\nfunction desktopPlan(direction) {\n  return {\n    duration: 200,\n    easing: EASE_DESKTOP,\n    incoming: [{ opacity: 0, transform: translate(0, 8) }, { opacity: 1, transform: translate(0) }],\n    outgoing: [{ opacity: 1 }, { opacity: 0 }],\n    incomingDim: [0, 0],\n    outgoingDim: [0, 0],\n  };\n}\n\nexport function transitionPlan(direction) {\n  const kind = platform();\n  if (kind === 'ios') return iosPlan(direction);\n  if (kind === 'android') return androidPlan(direction);\n  return desktopPlan(direction);\n}\n\n/** Animates `incoming` over `outgoing`; resolves when the layers can be cleaned up. */\nexport function runScreenTransition({ outgoing, incoming, direction }) {\n  if (!outgoing || !incoming || typeof incoming.animate !== 'function') return Promise.resolve();\n  if (prefersReducedMotion()) return Promise.resolve();\n\n  const plan = transitionPlan(direction);\n  const options = { duration: plan.duration, easing: plan.easing, fill: 'both' };\n  const dims = [];\n\n  const animateDim = (layer, [from, to]) => {\n    if (from === to) return null;\n    const node = document.createElement('span');\n    node.className = 'layer-dim';\n    layer.append(node);\n    dims.push(node);\n    return node.animate([{ opacity: from }, { opacity: to }], options);\n  };\n\n  const animations = [\n    incoming.animate(plan.incoming, options),\n    outgoing.animate(plan.outgoing, options),\n    animateDim(incoming, plan.incomingDim),\n    animateDim(outgoing, plan.outgoingDim),\n  ].filter(Boolean);\n\n  return Promise.allSettled(animations.map((animation) => animation.finished)).then(() => {\n    // Drop the fill so the layers sit at their natural position before we remove one.\n    for (const animation of animations) animation.cancel();\n    for (const node of dims) node.remove();\n  });\n}\n","install.js":"// \"Add to home screen\" onboarding — shown on iPhone/iPad and Android until the app runs from the\r\n// icon. Deliberately free of jargon: no PWA, no browser-menu wording beyond the labels\r\n// the phone actually shows.\r\nimport { platform } from './transition.js'\r\nimport { readString, writeString } from './stores.js'\r\n\r\nconst KEY = 'poc.installHint'\r\nconst OPEN_KEY = 'poc.installHintOpen'\r\n\r\n/** True when the page runs as an installed app (own window, no address bar). */\r\nexport function isStandalone() {\r\n  return window.matchMedia?.('(display-mode: standalone)')?.matches === true || navigator.standalone === true\r\n}\r\n\r\nexport function installHintDismissed() {\r\n  try {\r\n    return localStorage.getItem(KEY) != null\r\n  } catch {\r\n    return false\r\n  }\r\n}\r\n\r\nexport function dismissInstallHint() {\r\n  writeString(KEY, new Date().toISOString())\r\n}\r\n\r\n/**\r\n * iPhone/iPad and Android, only while it is not installed yet and the page is served from a\r\n * secure origin (installing is impossible from file://). `?install=1` forces the card\r\n * (screenshots, support), `?install=0` suppresses it.\r\n */\r\nexport function shouldShowInstallHint(search = location.search) {\r\n  const flag = new URLSearchParams(search).get('install')\r\n  if (flag === '0') return false\r\n  if (flag === '1') return true\r\n  const kind = platform()\r\n  if (kind !== 'ios' && kind !== 'android') return false\r\n  return window.isSecureContext === true && !isStandalone() && !installHintDismissed()\r\n}\r\n\r\n/** Disclosure state of the card: open on first visit, then whatever the user chose. */\r\nexport function installHintOpen() {\r\n  return readString(OPEN_KEY) !== '0'\r\n}\r\n\r\nexport function setInstallHintOpen(open) {\r\n  writeString(OPEN_KEY, open ? '1' : '0')\r\n}\r\n\r\n// Android/Chrome: keep the browser's own install prompt so the card can offer a real button.\r\nlet deferredPrompt = null\r\nconst listeners = new Set()\r\n\r\nif (typeof window !== 'undefined') {\r\n  window.addEventListener('beforeinstallprompt', (event) => {\r\n    event.preventDefault()\r\n    deferredPrompt = event\r\n    listeners.forEach((listener) => listener())\r\n  })\r\n  window.addEventListener('appinstalled', () => {\r\n    deferredPrompt = null\r\n    dismissInstallHint()\r\n    listeners.forEach((listener) => listener())\r\n  })\r\n}\r\n\r\nexport function canPromptInstall() {\r\n  return deferredPrompt != null\r\n}\r\n\r\n/** Calls `listener` whenever the prompt becomes (un)available; returns an unsubscribe function. */\r\nexport function onInstallPromptChange(listener) {\r\n  listeners.add(listener)\r\n  return () => listeners.delete(listener)\r\n}\r\n\r\n/** Shows the native install dialog. Resolves to true when the user accepted. */\r\nexport async function promptInstall() {\r\n  const prompt = deferredPrompt\r\n  if (!prompt) return false\r\n  deferredPrompt = null\r\n  prompt.prompt()\r\n  const choice = await prompt.userChoice.catch(() => null)\r\n  listeners.forEach((listener) => listener())\r\n  return choice?.outcome === 'accepted'\r\n}\r\n","categories.js":"// Category.normalize / symbol mapping — port of Model.swift `Category`.\r\n\r\n// Order = chip order on Home; matches the categories present in the partner export.\r\nexport const ALL = [\r\n  'Fitness',\r\n  'Wellness',\r\n  'Outdoor',\r\n  'Yoga',\r\n  'Pilates',\r\n  'EMS',\r\n  'CrossFit',\r\n  'Martial Arts',\r\n  'Dance',\r\n  'Bouldering',\r\n  'Physio',\r\n  'Racket',\r\n  'Water Sports',\r\n  'Cycling',\r\n  'Fever Dream',\r\n  'Other',\r\n]\r\n\r\n/** Case- and diacritic-insensitive fold, equivalent to Swift's .diacriticInsensitive. */\r\nexport function fold(value) {\r\n  return String(value ?? '')\r\n    .normalize('NFD')\r\n    .replace(/[\\u0300-\\u036f]/g, '')\r\n    .toLowerCase()\r\n}\r\n\r\n// Labels written by earlier builds (German UI, old export) → current English category.\r\nconst LEGACY = {\r\n  fitnessstudio: 'Fitness',\r\n  kampfsport: 'Martial Arts',\r\n  tanz: 'Dance',\r\n  bouldern: 'Bouldering',\r\n  wassersport: 'Water Sports',\r\n  sonstiges: 'Other',\r\n}\r\n\r\nexport function normalize(raw) {\r\n  const s = String(raw ?? '').trim()\r\n  if (!s) return 'Other'\r\n  const key = fold(s)\r\n  return ALL.find((category) => category.toLowerCase() === key) ?? LEGACY[key] ?? s\r\n}\r\n\r\n/** Web icon token per category (renderer lives in the views). */\r\nexport const SYMBOLS = {\r\n  Fitness: 'dumbbell',\r\n  Wellness: 'leaf',\r\n  Outdoor: 'person-hiking',\r\n  Yoga: 'lotus',\r\n  Pilates: 'mat-stretch',\r\n  Bouldering: 'climbing-hold',\r\n  'Martial Arts': 'boxing-glove',\r\n  Dance: 'dancing-figure',\r\n  EMS: 'bolt',\r\n  CrossFit: 'barbell',\r\n  Physio: 'physio',\r\n  Racket: 'racket',\r\n  'Water Sports': 'paddle',\r\n  Cycling: 'bike',\r\n  'Fever Dream': 'sparkles',\r\n  Other: 'map-pin',\r\n}\r\n\r\nexport function symbol(category) {\r\n  return SYMBOLS[category] ?? SYMBOLS.Other\r\n}\r\n","icons.js":"// Inline SVG icon set — no CDN. Category tokens match BUILD.md §6.\nconst ICONS = {\n  dumbbell: '<path d=\"M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12\"/>',\n  leaf: '<path d=\"M20 4C12 4 5 8 5 15a5 5 0 0 0 5 5c7 0 10-8 10-16Z\"/><path d=\"M5 20c2-6 6-9 11-11\"/>',\n  'person-hiking': '<circle cx=\"13\" cy=\"4\" r=\"2\"/><path d=\"M10 22l2-6 3 2 2 4M11 9l-2 7 4 1 2-5-3-2-1-1Z\"/>',\n  'climbing-hold': '<path d=\"M7 21l1-7 3 1 1-5 3 1-1 5 3-2 1 4-4 3Z\"/><path d=\"M8 14l-3-2M16 10l2-3\"/>',\n  'boxing-glove': '<path d=\"M7 21h10v-4l2-4V7a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v6l2 4v4Z\"/><path d=\"M7 10h10\"/>',\n  'dancing-figure': '<circle cx=\"13\" cy=\"4\" r=\"2\"/><path d=\"M12 7l-3 5 4 2 2-4M9 12l-3 3M13 14l-2 8M13 14l4 3 2 5\"/>',\n  bolt: '<path d=\"M13 2 4 14h7l-1 8 9-12h-7l1-8Z\"/>',\n  barbell: '<path d=\"M4 8v8M20 8v8M7 6v12M17 6v12M7 12h10\"/>',\n  'map-pin': '<path d=\"M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z\"/><circle cx=\"12\" cy=\"10\" r=\"2.5\"/>',\n  lotus: '<path d=\"M12 4c2.3 2.2 3.4 4.3 3.4 6.2a3.4 3.4 0 0 1-6.8 0c0-1.9 1.1-4 3.4-6.2Z\"/><path d=\"M4.6 10.4c1.9-.7 3.6 0 4.8 1.4M19.4 10.4c-1.9-.7-3.6 0-4.8 1.4\"/><path d=\"M3 16.2c2.9 2.6 5.9 3.6 9 3.6s6.1-1 9-3.6\"/>',\n  'mat-stretch': '<circle cx=\"6.2\" cy=\"9\" r=\"2\"/><path d=\"M8.4 11H14l4 4M8.4 11 7.4 17M14 11l2 6M18 15h2.2\"/>',\n  physio: '<path d=\"M12 20.2S5.4 16.2 5.4 11.4A3.6 3.6 0 0 1 12 9.3a3.6 3.6 0 0 1 6.6 2.1c0 4.8-6.6 8.8-6.6 8.8Z\"/>',\n  racket: '<ellipse cx=\"10\" cy=\"8.8\" rx=\"4.8\" ry=\"5.8\"/><path d=\"m13.4 13.2 5.4 5.4\"/><path d=\"M7.6 6.6h4.8M7 9.8h5.8\"/>',\n  paddle: '<path d=\"M2.8 17.4c2 1.5 4 1.5 6 0s4-1.5 6 0 3.9 1.5 5.4.2\"/><path d=\"M12 3.2v9.6\"/><path d=\"m9.8 5.4 2.2-2.2 2.2 2.2\"/>',\n  bike: '<circle cx=\"6\" cy=\"17\" r=\"3.2\"/><circle cx=\"18\" cy=\"17\" r=\"3.2\"/><path d=\"M9.2 17h4.6l-2-6H9M11.8 11l3 6M13.9 8h2.8\"/>',\n  sparkles: '<path d=\"M10 3l1.9 5.1L17 10l-5.1 1.9L10 17l-1.9-5.1L3 10l5.1-1.9Z\"/><path d=\"M18 14l.9 2.1L21 17l-2.1.9L18 20l-.9-2.1L15 17l2.1-.9Z\"/>',\n  search: '<circle cx=\"11\" cy=\"11\" r=\"6.5\"/><path d=\"m16 16 4.5 4.5\"/>',\n  // iOS share sheet: arrow out of the box.\n  share: '<path d=\"M12 3.4v10.6\"/><path d=\"m8.4 7 3.6-3.6L15.6 7\"/><path d=\"M7.4 10.6H4.8V20.6h14.4V10.6h-2.6\"/>',\n  camera: '<path d=\"M4 8h3l2-3h6l2 3h3v11H4z\"/><circle cx=\"12\" cy=\"13\" r=\"3.5\"/>',\n  'plus-circle': '<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 8v8M8 12h8\"/>',\n  'x-circle': '<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m9 9 6 6M15 9l-6 6\"/>',\n  'check-circle': '<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m8 12 2.8 2.8L16.5 9\"/>',\n  check: '<path d=\" pped = value.replace(new RegExp(`[\\\\s,\\\\-–]+${escaped}$`, 'i'), '').trim()\r\n    if (stripped && stripped !== value) return stripped\r\n  }\r\n  return value\r\n}\r\n\r\n/** Google Maps web link for a studio, or null when it has no coordinates. */\r\nexport function mapsUrl(studio) {\r\n  const { lat, lng } = studio ?? {}\r\n  if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null\r\n  return `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`\r\n}\r\n","seed.js":"// 982 WellPass partner studios — 891 from the Wellpass finder export (Berlin + Brandenburg), 91 legacy Köln/Düsseldorf.\n// Generated by pwa/tools/gen-seed.mjs — do not edit by hand.\n// Tuple: [name, category, city, lat?, lng?]. Köln/Düsseldorf have no coordinates.\nimport { normalize, fold } from './categories.js'\n\nexport function makeID(name) {\n  const slug = fold(name)\n    .replace(/[^a-z0-9]+/g, '-')\n    .replace(/^-+|-+$/g, '')\n  return slug || cryptoId()\n}\n\nexport function initials(name) {\n  return String(name ?? '')\n    .trim()\n    .split(/\\s+/)\n    .filter(Boolean)\n    .slice(0, 2)\n    .map((word) => word[0])\n    .join('')\n    .toUpperCase()\n}\n\nexport function cryptoId() {\n  if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID()\n  return `id-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`\n}\n\nconst SEED = [\n  [\"3 Zone Training Potsdam\",\"CrossFit\",\"Potsdam\",52.43448,13.05354],\n  [\"Abadá-Capoeira-Schule e.V. Berlin\",\"Martial Arts\",\"Berlin\",52.48903,13.4229],\n  [\"Academia Jangada Berlin\",\"Dance\",\"Berlin\",52.53807,13.41247],\n  [\"ACADIAC GmbH Berlin\",\"Yoga\",\"Berlin\",52.46278,13.34087],\n  [\"ACHTER - Berlin Prenzlauer Berg\",\"Fitness\",\"Berlin\",52.53772,13.40672],\n  [\"Achtsam bewegen - von Kopf bis Fuß Berlin\",\"Yoga\",\"Berlin\",52.44096,13.49903],\n  [\"Active Ladies Berlin Hohenschönhausen\",\"Fitness\",\"Berlin\",52.56547,13.50348],\n  [\"Adrian Iselin - Partner Movement Be
