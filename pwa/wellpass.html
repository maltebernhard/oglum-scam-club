 more Düsseldorf (Massage)\",\"Wellness\",\"Düsseldorf\"],\n  [\"Vitalis Gesundheitszentrum Düsseldorf\",\"Fitness\",\"Düsseldorf\"]\n]\n\nexport const seed = SEED.map(([name, category, city, lat, lng]) => ({\n  id: makeID(name),\n  name,\n  category: normalize(category),\n  city,\n  ...(lat !== undefined ? { lat, lng } : {}),\n  isCustom: false,\n}))\n","stores.js":"// Persistence parity with the iOS UserDefaults keys.\nimport { normalize, fold } from './categories.js'\nimport { seed, makeID, cryptoId } from './seed.js'\n\nconst CUSTOM_KEY = 'poc.studios.custom'\nconst HISTORY_KEY = 'poc.history'\nconst HISTORY_LIMIT = 50\n\n// ---------------------------------------------------------------------------\n// Storage: every access is guarded; on quota/blocked storage the latest value\n// stays in this in-memory fallback so the check-in flow never breaks.\n// ---------------------------------------------------------------------------\n\nconst memory = new Map()\n\n// Health of the real storage backend, so the debug panel can show why nothing\n// survives a relaunch (private mode, \"Block All Cookies\", full quota).\nlet storageState = { available: true, error: null }\n\nfunction markStorageError(error) {\n  storageState = { available: false, error: String(error?.name ?? error?.message ?? error) }\n}\n\nfunction markStorageOk() {\n  if (!storageState.available) storageState = { available: true, error: null }\n}\n\nexport function storageStatus() {\n  let bytes = 0\n  const keys = []\n  // Reading works even when writing throws (private mode, \"Block All Cookies\"),\n  // so probe a write before reporting the storage as healthy.\n  try {\n    localStorage.setItem('poc.__probe', '1')\n    localStorage.removeItem('poc.__probe')\n    markStorageOk()\n  } catch (error) {\n    markStorageError(error)\n  }\n  try {\n    for (let index = 0; index < localStorage.length; index++) {\n      const key = localStorage.key(index)\n      if (!key?.startsWith('poc.')) continue\n      const value = localStorage.getItem(key) ?? ''\n      keys.push({ key, bytes: value.length })\n      bytes += key.length + value.length\n    }\n  } catch (error) {\n    markStorageError(error)\n  }\n  return { ...storageState, pending: memory.size, bytes, keys }\n}\n\nexport function readString(key) {\n  if (memory.has(key)) return memory.get(key)\n  try {\n    const value = localStorage.getItem(key)\n    markStorageOk()\n    return value\n  } catch (error) {\n    markStorageError(error)\n    return null\n  }\n}\n\n/** Returns false only when the value could not leave memory. */\nexport function writeString(key, value) {\n  memory.set(key, value)\n  try {\n    localStorage.setItem(key, value)\n    memory.delete(key)\n    markStorageOk()\n    return true\n  } catch (error) {\n    // keep the in-memory copy so the flow keeps working\n    markStorageError(error)\n    return false\n  }\n}\n\nexport function removeString(key) {\n  memory.set(key, null)\n  try {\n    localStorage.removeItem(key)\n    memory.delete(key)\n    markStorageOk()\n  } catch (error) {\n    markStorageError(error)\n  }\n}\n\nexport function readJSON(key, fallback) {\n  const raw = readString(key)\n  if (raw == null) return fallback\n  try {\n    return JSON.parse(raw)\n  } catch {\n    return fallback\n  }\n}\n\nexport function writeJSON(key, value) {\n  try {\n    writeString(key, JSON.stringify(value))\n    return true\n  } catch (error) {\n    console.warn('Could not save', key, error)\n    return false\n  }\n}\n\n// ---------------------------------------------------------------------------\n// StudioStore\n// ---------------------------------------------------------------------------\n\nfunction sanitizeCustom(list) {\n  if (!Array.isArray(list)) return []\n  return list\n    .filter((item) => item && typeof item === 'object' && typeof item.name === 'string' && item.name.trim())\n    .map((item) => {\n      const name = item.name.trim()\n      return {\n        id: typeof item.id === 'string' && item.id ? item.id : makeID(name),\n        name,\n        category: normalize(item.category),\n        city: typeof item.city === 'string' ? item.city.trim() : '',\n        ...(Number.isFinite(item.lat) && Number.isFinite(item.lng) ? { lat: item.lat, lng: item.lng } : {}),\n        isCustom: true,\n      }\n    })\n}\n\nexport class StudioStore {\n  constructor() {\n    this.studios = [...seed, ...sanitizeCustom(readJSON(CUSTOM_KEY, []))]\n  }\n\n  studio(id) {\n    if (!id) return null\n    return this.studios.find((studio) => studio.id === id) ?? null\n  }\n\n  matching(query, category = null) {\n    const q = fold(String(query ?? '').trim())\n    return this.studios.filter((studio) => {\n      if (category != null && studio.normalizedCategory() !== category) return false\n      if (!q) return true\n      // City is searchable too: \"berlin\" finds all Berlin partners even when the\n      // studio name does not repeat the city.\n      return (\n        fold(studio.name).includes(q) ||\n        fold(studio.normalizedCategory()).includes(q) ||\n        fold(studio.city ?? '').includes(q)\n      )\n    })\n  }\n\n  count(category) {\n    return this.studios.filter((studio) => studio.normalizedCategory() === category).length\n  }\n\n  add(name, category, city = '') {\n    const trimmed = String(name ?? '').trim()\n    if (!trimmed) return null\n\n    const id = makeID(trimmed)\n    const existing = this.studios.find((studio) => studio.id === id)\n    if (existing) return existing\n\n    const studio = withHelpers({\n      id,\n      name: trimmed,\n      category: normalize(category),\n      isCustom: true,\n    })\n    this.studios.push(studio)\n    this.persistCustom()\n    return studio\n  }\n\n  delete(studio) {\n    if (!studio?.isCustom) return\n    this.studios = this.studios.filter((item) => item.id !== studio.id)\n    this.persistCustom()\n  }\n\n  persistCustom() {\n    writeJSON(CUSTOM_KEY, this.studios.filter((studio) => studio.isCustom).map(plainStudio))\n  }\n}\n\nfunction withHelpers(studio) {\n  return {\n    ...studio,\n    city: studio.city ?? '',\n    normalizedCategory: () => normalize(studio.category),\n    initials: () => (studio.name.match(/\\S+/g) ?? []).slice(0, 2).map((word) => word[0]).join('').toUpperCase(),\n  }\n}\n\nfunction plainStudio({ id, name, category, city, lat, lng, isCustom }) {\n  return { id, name, category, city: city ?? '', ...(Number.isFinite(lat) && Number.isFinite(lng) ? { lat, lng } : {}), isCustom }\n}\n\nexport const studioStore = new StudioStore()\n// Make seed entries behave like custom ones at call sites.\nstudioStore.studios = studioStore.studios.map((studio) => (studio.normalizedCategory ? studio : withHelpers(studio)))\n\n// ---------------------------------------------------------------------------\n// HistoryStore\n// ---------------------------------------------------------------------------\n\nfunction normalizeRecord(record) {\n  if (!record || typeof record !== 'object') return null\n  const studio = String(record.studio ?? '').trim()\n  if (!studio) return null\n  let date = Number(record.date)\n  if (!Number.isFinite(date)) date = Date.now()\n  if (date < 1e12) date *= 1000 // tolerate Swift epoch-seconds records\n  return {\n    id: typeof record.id === 'string' && record.id ? record.id : cryptoId(),\n    studio,\n    category: normalize(record.category),\n    date,\n  }\n}\n\nexport class HistoryStore {\n  constructor() {\n    const list = readJSON(HISTORY_KEY, [])\n    this.records = Array.isArray(list) ? list.map(normalizeRecord).filter(Boolean).slice(0, HISTORY_LIMIT) : []\n  }\n\n  add(studio, category, date = Date.now()) {\n    this.records.unshift({\n      id: cryptoId(),\n      studio: String(studio ?? ''),\n      category: normalize(category),\n      date: date instanceof Date ? date.getTime() : Number(date),\n    })\n    if (this.records.length > HISTORY_LIMIT) this.records = this.records.slice(0, HISTORY_LIMIT)\n    this.persist()\n  }\n\n  clear() {\n    this.records = []\n    this.persist()\n  }\n\n  persist() {\n    writeJSON(HISTORY_KEY, this.records)\n  }\n}\n\nexport const historyStore = new HistoryStore()\n\n// ---------------------------------------------------------------------------\n// Profile (poc.name / location / locationID / category / timestamp)\n// ---------------------------------------------------------------------------\n\nexport const Profile = {\n  get name() {\n    return readString('poc.name') ?? ''\n  },\n  set name(value) {\n    writeString('poc.name', String(value ?? ''))\n  },\n  get location() {\n    return readString('poc.location') ?? ''\n  },\n  set location(value) {\n    writeString('poc.location', String(value ?? ''))\n  },\n  get locationID() {\n    return readString('poc.locationID')\n  },\n  set locationID(value) {\n    value == null ? removeString('poc.locationID') : writeString('poc.locationID', String(value))\n  },\n  get category() {\n    return readString('poc.category') ?? ''\n  },\n  set category(value) {\n    writeString('poc.category', String(value ?? ''))\n  },\n  get timestamp() {\n    const raw = readString('poc.timestamp')\n    if (raw == null || raw === '') return null\n    const value = Number(raw)\n    if (!Number.isFinite(value) || value <= 0) return null\n    return value < 1e12 ? value * 1000 : value\n  },\n  set timestamp(value) {\n    value == null ? removeString('poc.timestamp') : writeString('poc.timestamp', String(Number(value)))\n  },\n  save({ name, location, locationID, category, timestamp }) {\n    if (name !== undefined) this.name = name\n    if (location !== undefined) this.location = location\n    if (locationID !== undefined) this.locationID = locationID\n    if (category !== undefined) this.category = category\n    if (timestamp !== undefined) this.timestamp = timestamp\n  },\n\n  /** Everything the check-in screen needs, as one plain object. */\n  snapshot() {\n    return {\n      name: this.name,\n      location: this.location,\n      locationID: this.locationID,\n      category: this.category,\n      timestamp: this.timestamp,\n    }\n  },\n}\n\nexport { CUSTOM_KEY, HISTORY_KEY, HISTORY_LIMIT }\n","selfie.js":"// Selfie pipeline + persistence. Same localStorage key as the iOS SelfieStore.\nimport { readString, writeString, removeString } from './stores.js'\n\nexport const SELFIE_KEY = 'poc.selfie'\nconst MAX_EDGE = 1024\nconst JPEG_QUALITY = 0.85\n\nexport function loadSelfie() {\n  return readString(SELFIE_KEY)\n}\n\n/** Returns false when the photo did not fit into storage (quota/private mode). */\nexport function saveSelfie(dataUrl) {\n  if (!dataUrl) {\n    removeString(SELFIE_KEY)\n    return true\n  }\n  return writeString(SELFIE_KEY, dataUrl) !== false\n}\n\nexport function initialsFor(name) {\n  const words = String(name ?? '').trim().split(/\\s+/).filter(Boolean).slice(0, 2)\n  return words.map((word) => word[0]).join('').toUpperCase() || 'LH'\n}\n\n/** Decode check used by the self-test (`selfie decodes`). */\nexport function selfieDecodes(dataUrl) {\n  if (!dataUrl) return Promise.resolve(false)\n  return new Promise((resolve) => {\n    const image = new Image()\n    image.onload = () => resolve(true)\n    image.onerror = () => resolve(false)\n    image.src = dataUrl\n  })\n}\n\n/**\n * File → decodable source. Safari's `createImageBitmap()` rejects Blob/File\n * sources (it only takes already-decoded images), so every failure falls back to\n * an `<img>` decode of an object URL. Without that fallback the selfie silently\n * never reaches localStorage on iOS.\n */\nasync function decodeImage(file) {\n  if (globalThis.createImageBitmap) {\n    try {\n      const bitmap = await createImageBitmap(file)\n      return {\n        source: bitmap,\n        width: bitmap.width,\n        height: bitmap.height,\n        release: () => bitmap.close?.(),\n      }\n    } catch (error) {\n      console.warn('createImageBitmap(file) failed, falling back to <img>:', error?.message)\n    }\n  }\n\n  const url = URL.createObjectURL(file)\n  try {\n    const image = await new Promise((resolve, reject) => {\n      const element = new Image()\n      element.onload = () => resolve(element)\n      element.onerror = () => reject(new Error('Image could not be read'))\n      element.src = url\n    })\n    return {\n      source: image,\n      width: image.naturalWidth,\n      height: image.naturalHeight,\n      release: () => URL.revokeObjectURL(url),\n    }\n  } catch (error) {\n    URL.revokeObjectURL(url)\n    throw error\n  }\n}\n\nasync function encodeJpeg(source, width, height) {\n  // A plain <canvas> is the one path that behaves identically in Safari and\n  // Chromium (`toBlob` is available everywhere we target).\n  const canvas = document.createElement('canvas')\n  canvas.width = width\n  canvas.height = height\n  canvas.getContext('2d').drawImage(source, 0, 0, width, height)\n  return new Promise((resolve, reject) => {\n    canvas.toBlob(\n      (blob) => (blob ? resolve(blob) : reject(new Error('JPEG-Encoding fehlgeschlagen'))),\n      'image/jpeg',\n      JPEG_QUALITY,\n    )\n  })\n}\n\nfunction blobToDataUrl(blob) {\n  return new Promise((resolve, reject) => {\n    const reader = new FileReader()\n    reader.onload = () => resolve(String(reader.result))\n    reader.onerror = () => reject(reader.error)\n    reader.readAsDataURL(blob)\n  })\n}\n\n/** File → downscaled JPEG ≤ ~300 KB → data URL → poc.selfie. */\nexport async function processImageFile(file, { maxEdge = MAX_EDGE } = {}) {\n  if (!file || !String(file.type).startsWith('image/')) throw new Error('Keine Bilddatei')\n  const decoded = await decodeImage(file)\n  try {\n    const { width, height } = decoded\n    if (!width || !height) throw new Error('Bild hat keine Abmessungen')\n\n    const scale = Math.min(1, maxEdge / Math.max(width, height))\n    const targetWidth = Math.max(1, Math.round(width * scale))\n    const targetHeight = Math.max(1, Math.round(height * scale))\n    const blob = await encodeJpeg(decoded.source, targetWidth, targetHeight)\n\n    const dataUrl = await blobToDataUrl(blob)\n    saveSelfie(dataUrl)\n    return dataUrl\n  } finally {\n    decoded.release()\n  }\n}\n\n/** Wire an <input type=\"file\"> to the pipeline (used by Home in M3). */\nexport function attachSelfieInput(input, onSaved) {\n  input.addEventListener('change', async () => {\n    const file = input.files?.[0]\n    input.value = ''\n    if (!file) return\n    try {\n      onSaved(await processImageFile(file))\n    } catch (error) {\n      console.warn('Could not save selfie:', error)\n    }\n  })\n}\n","selftest.js":"// Port of `OSCwellPassPoCApp.swift:runSelfTestIfRequested` + dataset assertions (counts come from tools/gen-seed.mjs).\r\nimport { ALL, normalize } from './categories.js'\r\nimport { studioStore, historyStore, readString, CUSTOM_KEY, HISTORY_KEY } from './stores.js'\r\nimport { loadSelfie, selfieDecodes } from './selfie.js'\r\nimport { formatTimestamp, stripCitySuffix, mapsUrl } from './format.js'\r\n\r\nconst SEED_TOTAL = 982\r\nconst SEED_WITH_COORDS = 891\r\n\r\nexport async function runSelfTest({ keep = false } = {}) {\r\n  const lines = []\r\n  const check = (label, ok, detail = '') => {\r\n    lines.push(`${ok ? 'PASS' : 'FAIL'} ${label}${detail ? ` — ${detail}` : ''}`)\r\n  }\r\n\r\n  const store = studioStore\r\n  const seedStudios = store.studios.filter((studio) => !studio.isCustom)\r\n  const seedCount = seedStudios.length\r\n  const inCity = (city) => seedStudios.filter((studio) => studio.city === city).length\r\n  check(`seed count == ${SEED_TOTAL}`, seedCount === SEED_TOTAL, String(seedCount))\r\n  check('Berlin 731 / Potsdam 41 / Köln 41 / Düsseldorf 50', inCity('Berlin') === 731 && inCity('Potsdam') === 41 && inCity('Köln') === 41 && inCity('Düsseldorf') === 50)\r\n  check('unique ids', new Set(store.studios.map((studio) => studio.id)).size === store.studios.length)\r\n  check('every category is known', seedStudios.every((studio) => ALL.includes(studio.normalizedCategory())))\r\n  check(`${SEED_WITH_COORDS} studios have coordinates`, seedStudios.filter((studio) => mapsUrl(studio)).length === SEED_WITH_COORDS)\r\n  check('Köln has no maps link', seedStudios.filter((studio) => studio.city === 'Köln').every((studio) => mapsUrl(studio) === null))\r\n\r\n  check('16 English categories', ALL.length === 16 && !ALL.includes('USC'))\r\n  check('Fitnessstudio -> Fitness', normalize('Fitnessstudio') === 'Fitness')\r\n  check('legacy German labels map', normalize('Kampfsport') === 'Martial Arts' && normalize('Tanz') === 'Dance' && normalize('Bouldern') === 'Bouldering' && normalize('Wassersport') === 'Water Sports' && normalize('Sonstiges') === 'Other')\r\n  check('normalize keeps Wellness', normalize('wellness') === 'Wellness')\r\n  check('empty category -> Other', normalize('') === 'Other')\r\n\r\n  check('city suffix stripped', stripCitySuffix('Berlin Running Society Berlin', 'Berlin') === 'Berlin Running Society')\r\n  check('city in the middle kept', stripCitySuffix('Yayaspa Berlin (Kreuzberg)', 'Berlin') === 'Yayaspa Berlin (Kreuzberg)')\r\n  check('name == city kept', stripCitySuffix('Berlin', 'Berlin') === 'Berlin')\r\n  check('Berlin-Mahlsdorf strips Berlin', stripCitySuffix('Studio X Berlin', 'Berlin-Mahlsdorf') === 'Studio X')\r\n  check('timestamp format', /^\\d\\d\\/\\d\\d\\/\\d\\d, \\d\\d:\\d\\d (AM|PM)$/.test(formatTimestamp(Date.now())), formatTimestamp(Date.now()))\r\n  check('maps url', mapsUrl({ lat: 52.5, lng: 13.4 }) === 'https://www.google.com/maps/search/?api=1&query=52.5,13.4')\r\n\r\n  const koeln = store.matching('köln', null)\r\n  check('search köln hits', koeln.length > 5, String(koeln.length))\r\n  const plain = store.matching('koln', null)\r\n  check('search is diacritic-insensitive', plain.length === koeln.length, String(plain.length))\r\n  check('search potsdam hits city', store.matching('potsdam', null).length >= 41, String(store.matching('potsdam', null).length))\r\n  const fitness = store.matching('', 'Fitness')\r\n  check('filter Fitness', fitness.every((studio) => studio.normalizedCategory() === 'Fitness'), String(fitness.length))\r\n\r\n  const added = store.add('Selftest Studio', 'Fitnessstudio')\r\n  check('add custom location', added != null)\r\n  check('custom is Fitness', added?.normalizedCategory() === 'Fitness')\r\n  check('custom visible', store.studio(added?.id) != null)\r\n  check('duplicate returns existing', store.add('Selftest Studio', 'EMS')?.id === added?.id)\r\n  check('persisted', readString(CUSTOM_KEY) != null)\r\n\r\n  if (added) store.delete(added)\r\n  check('delete custom', store.studio(added?.id) == null)\r\n  const seedCountAfter = store.studios.filter((studio) => !studio.isCustom).length\r\n  check('seed survives delete', seedCountAfter === SEED_TOTAL, String(seedCountAfter))\r\n  check('search berlin hits city', store.matching('berlin', null).length >= 730, String(store.matching('berlin', null).length))\r\n  check('category Yoga exists', store.count('Yoga') === 188, String(store.count('Yoga')))\r\n\r\n  const before = historyStore.records.length\r\n  historyStore.add('Selftest Studio', 'Fitness')\r\n  check('history append', historyStore.records.length === before + 1)\r\n  check('history encodes', readString(HISTORY_KEY) != null)\r\n  if (keep) {\r\n    check('history kept for screenshots', true)\r\n  } else {\r\n    historyStore.clear()\r\n    check('history clear', historyStore.records.length === 0)\r\n  }\r\n\r\n  const selfie = loadSelfie()\r\n  check('selfie decodes', await selfieDecodes(selfie), selfie ? `${selfie.length} chars` : 'nil')\r\n\r\n  const result = lines.join('\\n')\r\n  try {\r\n    localStorage.setItem('poc.selftest.result', result)\r\n  } catch {\r\n    // the console output below is still authoritative\r\n  }\r\n  console.table(lines.map((line) => ({ result: line.slice(0, 4), assertion: line.slice(5) })))\r\n  console.log(result)\r\n  return lines\r\n}\r\n\r\nexport function isSelfTestRequested() {\r\n  const params = new URLSearchParams(location.search)\r\n  return params.get('selftest') === 'on' || params.get('selftest') === '1'\r\n}\r\n\r\nexport function shouldKeepSelfTestHistory() {\r\n  const params = new URLSearchParams(location.search)\r\n  return params.get('selftest.keep') === 'on' || params.get('keep') === 'on'\r\n}\r\n","checkin-backdrop.js":"// Check-in backdrop built from elements (no image): teal band, card with shadow, the band's blurred\r\n// \"smear\" showing through the card, and the static texts of Wellpass_FINAL.png.\r\n//\r\n// Everything lives in the PNG's own coordinate system (2160 x 3840), so a 9:16 stage at any size lines up\r\n// with the reference artwork (which stretches that PNG to the screen height). Geometry measured off the PNG, see\r\n// docs/wellpass-html.md §2. To use the PNG instead, replace backdropMarkup() with an <img> of the same box.\r\nconst W = 2160\r\nconst H = 3840\r\n\r\nconst TEAL = '#337b89'\r\nconst CARD = { x: 266, y: 432, w: 1649, h: 2923, r: 106 }\r\nconst SMEAR = { opacity: 0.2757, blur: 110 }\r\n\r\n// Band edges as y/H = poly(x/W) (highest power first), fitted to the edge samples measured left and right of\r\n// the card; the hidden middle is fitted against the smear. Outside 0..1 the edges continue as straight lines\r\n// so the band also fills stages narrower than the screen.\r\nconst UPPER = [-1.5753778593467926, 2.635182230884844, -0.7748525618809043, 0.39642729313606845, 0.11552173755825348]\r\nconst LOWER = [-0.860289703042492, 0.762868045740052, 0.35567233891097694, 0.39862421608992166, 0.2623766892241983]\r\n\r\nconst evalPoly = (coeffs, x) => coeffs.reduce((acc, c) => acc * x + c, 0)\r\nconst derivPoly = (coeffs, x) => {\r\n  const n = coeffs.length - 1\r\n  return coeffs.slice(0, -1).reduce((acc, c, i) => acc * x + c * (n - i), 0)\r\n}\r\n\r\nfunction edgeY(coeffs, x) {\r\n  if (x >= 0 && x <= 1) return evalPoly(coeffs, x)\r\n  const edge = x < 0 ? 0 : 1\r\n  return evalPoly(coeffs, edge) + derivPoly(coeffs, edge) * (x - edge)\r\n}\r\n\r\nfunction bandPath() {\r\n  const from = -1.5\r\n  const to = 2.5\r\n  const steps = 64\r\n  const xs = Array.from({ length: steps + 1 }, (_, i) => from + ((to - from) * i) / steps)\r\n  const point = (coeffs, x) => `${(x * W).toFixed(1)} ${(edgeY(coeffs, x) * H).toFixed(1)}`\r\n  const upper = xs.map((x) => point(UPPER, x))\r\n  const lower = xs.map((x) => point(LOWER, x)).reverse()\r\n  return `M${upper.join('L')}L${lower.join('L')}Z`\r\n}\r\n\r\nconst escapeXml = (value) => String(value).replace(/[&<>\"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' })[c])\r\n\r\n// textLength pins each text to the width it has in the PNG whatever font the device has.\r\nfunction text({ value, x, y, size, length, weight, fill, spacing = 0 }) {\r\n  return `<text x=\"${x}\" y=\"${y}\" font-size=\"${size}\" font-weight=\"${weight}\" fill=\"${fill}\" letter-spacing=\"${spacing}\"\r\n    textLength=\"${length}\" lengthAdjust=\"spacing\">${escapeXml(value)}<\/text>`\r\n}\r\n\r\nexport function backdropMarkup({ title = 'Check-in', headline = 'Session validated' } = {}) {\r\n  const card = `x=\"${CARD.x}\" y=\"${CARD.y}\" width=\"${CARD.w}\" height=\"${CARD.h}\" rx=\"${CARD.r}\" ry=\"${CARD.r}\"`\r\n  return `\r\n    <svg class=\"ci-bg\" viewBox=\"0 0 ${W} ${H}\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\r\n      <defs>\r\n        <filter id=\"ci-card-shadow\" filterUnits=\"userSpaceOnUse\" x=\"-200\" y=\"200\" width=\"2560\" height=\"3700\">\r\n          <feDropShadow dx=\"0\" dy=\"45\" stdDeviation=\"40\" flood-color=\"#000\" flood-opacity=\"0.21\" />\r\n        <\/filter>\r\n        <filter id=\"ci-smear-blur\" filterUnits=\"userSpaceOnUse\" x=\"-100\" y=\"150\" width=\"2360\" height=\"3500\">\r\n          <feGaussianBlur stdDeviation=\"${SMEAR.blur}\" />\r\n        <\/filter>\r\n        <clipPath id=\"ci-card-clip\"><rect ${card} /><\/clipPath>\r\n      <\/defs>\r\n      <path d=\"${bandPath()}\" fill=\"${TEAL}\" />\r\n      <rect ${card} fill=\"#fafafa\" filter=\"url(#ci-card-shadow)\" />\r\n      <g clip-path=\"url(#ci-card-clip)\">\r\n        <path d=\"${bandPath()}\" fill=\"${TEAL}\" fill-opacity=\"${SMEAR.opacity}\" filter=\"url(#ci-smear-blur)\" />\r\n      <\/g>\r\n      <path d=\"M388 295 L346 335 L388 375\" fill=\"none\" stroke=\"#111\" stroke-width=\"15\" stroke-linecap=\"round\" stroke-linejoin=\"round\" />\r\n      ${text({ value: title, x: 941, y: 357, size: 68, length: 290, weight: 600, fill: '#111' })}\r\n      ${text({ value: headline, x: 529, y: 1188, size: 138, length: 1113, weight: 600, fill: '#094450' })}\r\n      ${text({ value: 'EGYM', x: 943, y: 3565, size: 66, length: 297, weight: 600, fill: '#1a1a1a' })}\r\n      ${text({ value: 'WELLPASS', x: 740, y: 3684, size: 101, length: 701, weight: 400, fill: '#1a1a1a' })}\r\n    <\/svg>`\r\n}\r\n","views/home.js":"import { ALL, normalize, symbol } from '../categories.js'\nimport { icon } from '../icons.js'\nimport { studioStore, historyStore, Profile, storageStatus } from '../stores.js'\nimport { loadSelfie, processImageFile } from '../selfie.js'\nimport { formatTimestamp, mapsUrl } from '../format.js'\nimport { openAddLocationDialog } from './add-location.js'\nimport { shouldShowInstallHint, dismissInstallHint, isStandalone, installHintOpen, setInstallHintOpen, canPromptInstall, onInstallPromptChange, promptInstall } from '../install.js'\nimport { platform } from '../transition.js'\n\nlet state = null\n\n// Selected on first launch, when no studio has been chosen yet.\nconst DEFAULT_STUDIO_ID = 'seegut-blaue-blume'\nfunction params() {\n  return new URLSearchParams(location.search)\n}\n\nfunction clearLocationIfSelected(studio) {\n  if (Profile.locationID !== studio.id) return\n  Profile.locationID = null\n  Profile.location = ''\n  Profile.category = ''\n}\n\nfunction restoreLastLocation() {\n  const studio = studioStore.studio(Profile.locationID) ?? studioStore.studio(DEFAULT_STUDIO_ID)\n  if (!studio) return\n  if (Profile.locationID !== studio.id) Profile.locationID = studio.id\n  if (Profile.location !== studio.name || Profile.category !== studio.normalizedCategory()) {\n    Profile.location = studio.name\n    Profile.category = studio.normalizedCategory()\n  }\n}\n\n// Onboarding for iPhone/iPad and Android: plain words, no \"PWA\"/\"Service Worker\" jargon.\nfunction installStepsMarkup() {\n  if (platform() === 'android') {\n    return `\n        <button type=\"button\" class=\"install-action\" id=\"install-prompt\" hidden>Install app<\/button>\n        <ol class=\"install-steps\">\n          <li><span class=\"install-num\">1<\/span><span>Tap the <b>⋮<\/b> menu at the top right of Chrome.<\/span><\/li>\n          <li><span class=\"install-num\">2<\/span><span>Tap <b>Install app<\/b> (or <b>Add to Home screen<\/b>).<\/span><\/li>\n          <li><span class=\"install-num\">3<\/span><span>Confirm with <b>Install<\/b>.<\/span><\/li>\n          <li><span class=\"install-num\">4<\/span><span>Done: the app icon is now with your other apps.<\/span><\/li>\n        <\/ol>`\n  }\n  return `\n        <ol class=\"install-steps\">\n          <li><span class=\"install-num\">1<\/span><span>Tap <b>Share<\/b> ${icon('share', 13, { strokeWidth: 2 })} at the bottom of Safari.<\/span><\/li>\n          <li><span class=\"install-num\">2<\/span><span>Scroll a little and tap <b>Add to Home Screen<\/b>.<\/span><\/li>\n          <li><span class=\"install-num\">3<\/span><span>Tap <b>Add<\/b> at the top right.<\/span><\/li>\n          <li><span class=\"install-num\">4<\/span><span>Done: the app icon is now with your other apps.<\/span><\/li>\n        <\/ol>`\n}\n\nfunction installHintMarkup() {\n  if (!shouldShowInstallHint()) return ''\n  const open = installHintOpen()\n  return `\n    <section class=\"card install-card\" id=\"install-card\" aria-labelledby=\"install-title\">\n      <button type=\"button\" class=\"install-head\" id=\"install-toggle\" aria-expanded=\"${open}\"\n              aria-controls=\"install-body\">\n        <span class=\"install-copy\">\n          <span class=\"install-title\" id=\"install-title\">Add to your home screen<\/span>\n          <span class=\"install-sub\">Opens like a regular app<\/span>\n        <\/span>\n        <span class=\"install-chevron\" id=\"install-chevron\">${icon(open ? 'chevron-up' : 'chevron-down', 13, { strokeWidth: 2.4 })}<\/span>\n      <\/button>\n      <div class=\"install-body\" id=\"install-body\"${open ? '' : ' hidden'}>\n        <p class=\"install-lead\">It then opens like any other app — with its own icon and no address bar.<\/p>${installStepsMarkup()}\n        <button type=\"button\" class=\"install-dismiss\" id=\"install-dismiss\">Got it<\/button>\n      <\/div>\n    <\/section>\n  `\n}\n\nfunction cardMarkup() {\n  return `\n    <header class=\"home-header\">\n      <div>\n        <h1 class=\"home-title\">Oglum Scam Club<\/h1>\n        <p class=\"home-subtitle\">All Gainz No Brainz<\/p>\n      <\/div>\n    <\/header>\n\n    ${installHintMarkup()}\n\n    <button type=\"button\" class=\"card selfie-card\" id=\"selfie-button\">\n      <span class=\"selfie-avatar\">\n        <img id=\"selfie-img\" alt=\"\" hidden />\n        <span class=\"selfie-placeholder\" id=\"selfie-placeholder\">${icon('camera', 20, { strokeWidth: 2 })}<\/span>\n      <\/span>\n      <span class=\"selfie-copy\">\n        <span class=\"selfie-title\">Selfie<\/span>\n        <span class=\"selfie-sub\" id=\"selfie-sub\">Choose photo<\/span>\n      <\/span>\n      <span class=\"selfie-chevron\">${icon('chevron-right', 14, { strokeWidth: 2.4 })}<\/span>\n    <\/button>\n\n    <div class=\"card name-card\">\n      <label class=\"field-label\" for=\"name-input\">Name<\/label>\n      <input id=\"name-input\" class=\"name-input\" type=\"text\" placeholder=\"Your name\"\n             autocomplete=\"name\" autocapitalize=\"words\" spellcheck=\"false\" />\n    <\/div>\n\n    <div class=\"card location-card\">\n      <div class=\"location-label-row\">\n        <span class=\"field-label\">Location<\/span>\n        <button type=\"button\" class=\"add-location\" id=\"add-location\">\n          ${icon('plus-circle', 13, { strokeWidth: 2.2 })}<span>New<\/span>\n        <\/button>\n      <\/div>\n\n      <div class=\"search-pill\" id=\"search-pill\">\n        ${icon('search', 15, { strokeWidth: 2.2 })}\n        <input id=\"search-input\" type=\"search\" placeholder=\"Search studios\" autocomplete=\"off\"\n               autocapitalize=\"none\" spellcheck=\"false\" enterkeyhint=\"search\" />\n        <button type=\"button\" class=\"search-clear\" id=\"search-clear\" aria-label=\"Clear search\" hidden>\n          ${icon('x-circle', 15, { strokeWidth: 2 })}\n        <\/button>\n      <\/div>\n\n      <div class=\"chips\" id=\"chips\" role=\"group\" aria-label=\"Categories\"><\/div>\n      <div class=\"location-body\" id=\"location-body\"><\/div>\n    <\/div>\n\n    <button type=\"button\" class=\"checkin-button\" id=\"checkin-button\">Check-In<\/button>\n\n    <section class=\"card history-card\" id=\"history-card\">\n      <button type=\"button\" class=\"history-head\" id=\"history-toggle\" aria-expanded=\"false\">\n        <span class=\"history-title\">History<\/span>\n        <span class=\"history-count\" id=\"history-count\" hidden><\/span>\n        <span class=\"history-chevron\" id=\"history-chevron\">${icon('chevron-down', 13, { strokeWidth: 2.4 })}<\/span>\n      <\/button>\n      <div class=\"history-body\" id=\"history-body\" hidden><\/div>\n    <\/section>\n  `\n}\n\nexport function mount(root, { navigate } = {}) {\n  if (!state) state = { query: '', categoryFilter: null, searchFocused: false, showHistory: false }\n  state.query = ''\n  state.categoryFilter = null\n  state.searchFocused = false\n  state.showHistory = false\n\n  const section = document.createElement('section')\n  section.id = 'home'\n  section.className = 'screen'\n  const chromeParam = params().get('chrome')\n  section.innerHTML = `${chromeParam === '0' ? '<div class=\"chrome-spacer\" aria-hidden=\"true\"><\/div>' : ''}\n    <div class=\"home-scroll\">${cardMarkup()}<\/div>\n    <input id=\"selfie-input\" type=\"file\" accept=\"image/*\" hidden />`\n  root.append(section)\n\n  const refs = {\n    installToggle: section.querySelector('#install-toggle'),\n    installChevron: section.querySelector('#install-chevron'),\n    installBody: section.querySelector('#install-body'),\n    installDismiss: section.querySelector('#install-dismiss'),\n    installPrompt: section.querySelector('#install-prompt'),\n    selfieButton: section.querySelector('#selfie-button'),\n    selfieImg: section.querySelector('#selfie-img'),\n    selfiePlaceholder: section.querySelector('#selfie-placeholder'),\n    selfieSub: section.querySelector('#selfie-sub'),\n    selfieInput: section.querySelector('#selfie-input'),\n    nameInput: section.querySelector('#name-input'),\n    searchPill: section.querySelector('#search-pill'),\n    searchInput: section.querySelector('#search-input'),\n    searchClear: section.querySelector('#search-clear'),\n    chips: section.querySelector('#chips'),\n    locationBody: section.querySelector('#location-body'),\n    addLocation: section.querySelector('#add-location'),\n    checkin: section.querySelector('#checkin-button'),\n    historyToggle: section.querySelector('#history-toggle'),\n    historyChevron: section.querySelector('#history-chevron'),\n    historyCount: section.querySelector('#history-count'),\n    historyBody: section.querySelector('#history-body'),\n  }\n\n  refs.nameInput.value = Profile.name\n  updateSelfie(refs)\n\n  // Onboarding card: expandable like History, dismissed for good by its button.\n  let installOpen = installHintOpen()\n  const renderInstall = () => {\n    refs.installToggle.setAttribute('aria-expanded', String(installOpen))\n    refs.installChevron.innerHTML = icon(installOpen ? 'chevron-up' : 'chevron-down', 13, { strokeWidth: 2.4 })\n    refs.installBody.hidden = !installOpen\n  }\n  if (refs.installToggle) {\n    refs.installToggle.addEventListener('click', () => {\n      installOpen = !installOpen\n      setInstallHintOpen(installOpen)\n      renderInstall()\n    })\n    refs.installDismiss.addEventListener('click', () => {\n      dismissInstallHint()\n      section.querySelector('#install-card')?.remove()\n    })\n    if (refs.installPrompt) {\n      const syncPrompt = () => {\n        refs.installPrompt.hidden = !canPromptInstall()\n      }\n      syncPrompt()\n      onInstallPromptChange(syncPrompt)\n      refs.installPrompt.addEventListener('click', async () => {\n        if (await promptInstall()) section.querySelector('#install-card')?.remove()\n      })\n    }\n  }\n\n  const renderChips = () => {\n    refs.chips.replaceChildren()\n    for (const category of ALL) {\n      const selected = state.categoryFilter === category\n      const button = document.createElement('button')\n      button.type = 'button'\n      button.className = `chip${selected ? ' is-selected' : ''}`\n      button.setAttribute('aria-pressed', String(selected))\n      button.innerHTML = `${icon(categoryIcon(category), 10.5, { strokeWidth: 2.2 })}<span>${category}<\/span>`\n      button.addEventListener('click', () => {\n        state.categoryFilter = selected ? null : category\n        state.searchFocused = false\n        renderChips()\n        renderBody()\n        updateClear(refs)\n      })\n      refs.chips.append(button)\n    }\n  }\n\n  const renderBody = () => {\n    const showResults = state.searchFocused || state.query !== '' || state.categoryFilter !== null\n    if (showResults) renderResults(refs, renderAll)\n    else renderSelected(refs)\n  }\n\n  const renderAll = () => {\n    renderChips()\n    renderBody()\n    updateClear(refs)\n    renderHistory(refs)\n  }\n\n  refs.selfieButton.addEventListener('click', () => refs.selfieInput.click())\n  refs.selfieInput.addEventListener('change', async () => {\n    const file = refs.selfieInput.files?.[0]\n    refs.selfieInput.value = ''\n    if (!file) return\n    try {\n      await processImageFile(file)\n      updateSelfie(refs)\n    } catch (error) {\n      console.warn('Could not save selfie:', error)\n      refs.selfieSub.textContent = 'Photo unreadable — please choose again'\n      setTimeout(() => updateSelfie(refs), 2600)\n    }\n  })\n\n  // iOS fires `change` after autofill/dictation without a per-keystroke `input`,\n  // so save on every event that can carry the final value.\n  const saveName = () => {\n    if (Profile.name !== refs.nameInput.value) Profile.name = refs.nameInput.value\n  }\n  refs.nameInput.addEventListener('input', saveName)\n  refs.nameInput.addEventListener('change', saveName)\n  refs.nameInput.addEventListener('blur', saveName)\n\n  // A home-screen app can be killed from the switcher without `unload`:\n  // flush whatever is on screen while the page is still alive — but never let a\n  // stale/empty field wipe a stored name.\n  const flush = () => {\n    if (refs.nameInput.value.trim() !== '') saveName()\n  }\n  window.addEventListener('pagehide', flush)\n  document.addEventListener('visibilitychange', () => {\n    if (document.visibilityState === 'hidden') flush()\n  })\n\n  refs.searchInput.addEventListener('focus', () => {\n    state.searchFocused = true\n    renderBody()\n  })\n  refs.searchInput.addEventListener('input', () => {\n    state.query = refs.searchInput.value\n    state.searchFocused = true\n    updateClear(refs)\n    renderBody()\n  })\n  refs.searchInput.addEventListener('keydown', (event) => {\n    if (event.key === 'Escape') {\n      state.query = ''\n      state.categoryFilter = null\n      state.searchFocused = false\n      refs.searchInput.value = ''\n      refs.searchInput.blur()\n      renderAll()\n    }\n  })\n  refs.searchClear.addEventListener('click', () => {\n    state.query = ''\n    state.categoryFilter = null\n    state.searchFocused = false\n    refs.searchInput.value = ''\n    refs.searchInput.blur()\n    renderAll()\n  })\n\n  refs.addLocation.addEventListener('click', () => {\n    openAddLocationDialog((name, category) => {\n      const studio = studioStore.add(name, category)\n      if (!studio) return\n      selectStudio(studio)\n      state.query = ''\n      state.searchFocused = false\n      refs.searchInput.value = ''\n      renderAll()\n    })\n  })\n\n  refs.checkin.addEventListener('click', () => {\n    Profile.timestamp = Date.now()\n    historyStore.add(Profile.location || 'WellPass Studio', normalize(Profile.category), Profile.timestamp)\n    ;(navigate ?? navigateTo)('/app/checkin')\n  })\n\n  refs.historyToggle.addEventListener('click', () => {\n    state.showHistory = !state.showHistory\n    renderHistory(refs)\n  })\n\n  restoreLastLocation()\n  const demo = params().get('demo')\n  if (demo === 'search') {\n    state.query = 'fitness first'\n    state.categoryFilter = 'Fitness'\n    state.searchFocused = true\n    refs.searchInput.value = state.query\n  } else if (demo === 'history') {\n    state.showHistory = true\n  }\n\n  renderAll()\n\n  setTimeout(() => {\n    if (demo === 'search') refs.searchInput.focus()\n  }, 0)\n\n  if (params().get('debug') === '1') addDebugPanel(section)\n}\n\nfunction navigateTo(url) {\n  history.pushState({ pwa: true }, '', url)\n  window.dispatchEvent(new PopStateEvent('popstate'))\n}\n\n// Category → icon token lives in categories.js so Home, the dialog and Check-in agree.\nconst categoryIcon = symbol\n\nfunction updateSelfie(refs) {\n  const selfie = loadSelfie()\n  if (selfie) {\n    refs.selfieImg.src = selfie\n    refs.selfieImg.hidden = false\n    refs.selfiePlaceholder.hidden = true\n    refs.selfieSub.textContent = 'Change photo'\n  } else {\n    refs.selfieImg.removeAttribute('src')\n    refs.selfieImg.hidden = true\n    refs.selfiePlaceholder.hidden = false\n    refs.selfieSub.textContent = 'Choose photo'\n  }\n}\n\nfunction updateClear(refs) {\n  refs.searchClear.hidden = state.query === '' && state.categoryFilter === null\n}\n\nfunction selectStudio(studio) {\n  Profile.locationID = studio.id\n  Profile.location = studio.name\n  Profile.category = studio.normalizedCategory()\n}\n\nfunction renderResults(refs, onChange) {\n  const results = studioStore.matching(state.query, state.categoryFilter).slice(0, 40)\n  const list = document.createElement('div')\n  list.className = 'results'\n\n  if (results.length === 0) {\n    const empty = document.createElement('p')\n    empty.className = 'results-empty'\n    empty.textContent = 'Nothing found — tap “New” to add it.'\n    list.append(empty)\n  } else {\n    for (const studio of results) {\n      list.append(studioRow(studio, refs, onChange))\n    }\n  }\n  refs.locationBody.replaceChildren(list)\n}\n\nfunction studioRow(studio, refs, onChange) {\n  const selected = Profile.locationID === studio.id\n  const row = document.createElement('button')\n  row.type = 'button'\n  row.className = 'studio-row'\n  row.dataset.studioId = studio.id\n  row.innerHTML = `\n    <span class=\"studio-icon\">${icon(categoryIcon(studio.normalizedCategory()), 14, { strokeWidth: 2.2 })}<\/span>\n    <span class=\"studio-copy\">\n      <span class=\"studio-name\"><\/span>\n      <span class=\"studio-category\"><\/span>\n    <\/span>\n    <span class=\"studio-check${selected ? '' : ' is-hidden'}\">${icon('check-circle', 15, { strokeWidth: 2 })}<\/span>`\n  row.querySelector('.studio-name').textContent = studio.name\n  row.querySelector('.studio-category').textContent = studio.normalizedCategory()\n\n  const deleteStudio = () => {\n    studioStore.delete(studio)\n    clearLocationIfSelected(studio)\n    onChange()\n  }\n\n  let pressTimer = null\n  let longPressed = false\n\n  const attachDeleteGesture = (wrapper, deleteButton) => {\n    let start = null\n    let dragging = false\n    let dx = 0\n    let open = false\n    let suppressClick = false\n\n    const setOpen = (next) => {\n      open = next\n      wrapper.classList.toggle('is-open', open)\n      row.style.transition = ''\n      row.style.transform = open ? 'translateX(-88px)' : ''\n      deleteButton.tabIndex = open ? 0 : -1\n    }\n    const cancelPress = () => {\n      clearTimeout(pressTimer)\n      pressTimer = null\n    }\n    const settle = () => {\n      cancelPress()\n      if (!dragging) {\n        start = null\n        return\n      }\n      const travel = dx\n      start = null\n      dragging = false\n      if (travel <= -132) {\n        deleteStudio()\n        return\n      }\n      setOpen(travel <= -44)\n      suppressClick = true\n      setTimeout(() => (suppressClick = false), 250)\n    }\n\n    row.addEventListener('pointerdown', (event) => {\n      if (event.button !== 0) return\n      longPressed = false\n      suppressClick = false\n      start = { x: event.clientX, y: event.clientY }\n      dragging = false\n      dx = open ? -88 : 0\n      cancelPress()\n      pressTimer = setTimeout(async () => {\n        if (dragging) return\n        longPressed = true\n        if (await confirmDialog(`Delete “${studio.name}”?`, 'Delete')) deleteStudio()\n      }, 550)\n    })\n\n    row.addEventListener('pointermove', (event) => {\n      if (!start) return\n      const moveX = event.clientX - start.x\n      const moveY = event.clientY - start.y\n      if (!dragging) {\n        if (Math.abs(moveX) < 8 || Math.abs(moveX) <= Math.abs(moveY)) return\n        dragging = true\n        cancelPress()\n        row.setPointerCapture?.(event.pointerId)\n      }\n      event.preventDefault()\n      dx = Math.max(-140, Math.min(0, (open ? -88 : 0) + moveX))\n      row.style.transition = 'none'\n      row.style.transform = `translateX(${dx}px)`\n    })\n\n    for (const eventName of ['pointerup', 'pointercancel']) row.addEventListener(eventName, settle)\n    row.addEventListener('pointerleave', () => {\n      if (!dragging) cancelPress()\n    })\n    row.addEventListener('contextmenu', async (event) => {\n      event.preventDefault()\n      if (await confirmDialog(`Delete “${studio.name}”?`, 'Delete')) deleteStudio()\n    })\n    deleteButton.addEventListener('click', deleteStudio)\n\n    row.addEventListener('click', (event) => {\n      if (suppressClick) {\n        event.preventDefault()\n        suppressClick = false\n        return\n      }\n      if (longPressed) {\n        event.preventDefault()\n        longPressed = false\n        return\n      }\n      if (open) {\n        event.preventDefault()\n        setOpen(false)\n        return\n      }\n      selectStudio(studio)\n      state.query = ''\n      state.searchFocused = false\n      refs.searchInput.value = ''\n      onChange()\n    })\n  }\n\n  if (studio.isCustom) {\n    const wrapper = document.createElement('div')\n    wrapper.className = 'studio-swipe'\n    const deleteButton = document.createElement('button')\n    deleteButton.type = 'button'\n    deleteButton.className = 'studio-delete'\n    deleteButton.textContent = 'Delete'\n    deleteButton.tabIndex = -1\n    deleteButton.setAttribute('aria-label', `Delete “${studio.name}”`)\n    wrapper.append(deleteButton, row)\n    attachDeleteGesture(wrapper, deleteButton)\n    return wrapper\n  }\n\n  row.addEventListener('click', () => {\n    selectStudio(studio)\n    state.query = ''\n    state.searchFocused = false\n    refs.searchInput.value = ''\n    onChange()\n  })\n  return row\n}\n\nfunction renderSelected(refs) {\n  const studio = studioStore.studio(Profile.locationID)\n  if (studio) {\n    const card = document.createElement('div')\n    card.className = 'selected-card'\n    card.innerHTML = `\n      <span class=\"studio-icon\">${icon(categoryIcon(studio.normalizedCategory()), 15, { strokeWidth: 2.2 })}<\/span>\n      <span class=\"studio-copy\">\n        <span class=\"selected-name\"><\/span>\n        <span class=\"studio-category\"><\/span>\n      <\/span>\n      <span class=\"studio-check\">${icon('check-circle', 17, { strokeWidth: 2 })}<\/span>`\n    card.querySelector('.selected-name').textContent = studio.name\n    card.querySelector('.studio-category').textContent = studio.normalizedCategory()\n    const href = mapsUrl(studio)\n    if (href) {\n      const link = document.createElement('a')\n      link.className = 'maps-link'\n      link.href = href\n      link.target = '_blank'\n      link.rel = 'noopener noreferrer'\n      link.setAttribute('aria-label', `Open ${studio.name} in Maps`)\n      link.innerHTML = `${icon('map-pin', 14, { strokeWidth: 2.2 })}<span>Maps<\/span>`\n      card.querySelector('.studio-check').before(link)\n    }\n    refs.locationBody.replaceChildren(card)\n    return\n  }\n\n  const empty = document.createElement('button')\n  empty.type = 'button'\n  empty.className = 'location-empty'\n  empty.textContent = 'Select a studio — search above or add one'\n  empty.addEventListener('click', () => refs.searchInput.focus())\n  refs.locationBody.replaceChildren(empty)\n}\n\nfunction renderHistory(refs) {\n  refs.historyToggle.setAttribute('aria-expanded', String(state.showHistory))\n  refs.historyChevron.innerHTML = icon(state.showHistory ? 'chevron-up' : 'chevron-down', 13, { strokeWidth: 2.4 })\n  refs.historyCount.hidden = historyStore.records.length === 0\n  refs.historyCount.textContent = String(historyStore.records.length)\n  refs.historyBody.hidden = !state.showHistory\n  if (!state.showHistory) {\n    refs.historyBody.replaceChildren()\n    return\n  }\n\n  const nodes = []\n  if (historyStore.records.length === 0) {\n    const empty = document.createElement('p')\n    empty.className = 'history-empty'\n    empty.textContent = 'No check-ins yet.'\n    nodes.push(empty)\n  } else {\n    for (const record of historyStore.records) {\n      const row = document.createElement('div')\n      row.className = 'history-row'\n      row.innerHTML = `\n        <span class=\"history-icon\">${icon(categoryIcon(normalize(record.category)), 13, { strokeWidth: 2.2 })}<\/span>\n        <span class=\"history-copy\">\n          <span class=\"history-studio\"><\/span>\n          <span class=\"history-date\"><\/span>\n        <\/span>\n        <span class=\"history-category\"><\/span>`\n      row.querySelector('.history-studio').textContent = record.studio\n      row.querySelector('.history-date').textContent = formatTimestamp(record.date)\n      row.querySelector('.history-category').textContent = normalize(record.category)\n      nodes.push(row)\n    }\n    const divider = document.createElement('div')\n    divider.className = 'history-divider'\n    nodes.push(divider)\n\n    const clear = document.createElement('button')\n    clear.type = 'button'\n    clear.className = 'history-clear'\n    clear.textContent = 'Clear history'\n    clear.addEventListener('click', async () => {\n      if (!(await confirmDialog('Delete the entire history?', 'Clear history'))) return\n      historyStore.clear()\n      renderHistory(refs)\n    })\n    nodes.push(clear)\n  }\n  refs.historyBody.replaceChildren(...nodes)\n}\n\nfunction confirmDialog(message, confirmLabel) {\n  return new Promise((resolve) => {\n    const dialog = document.createElement('dialog')\n    dialog.className = 'confirm-dialog'\n    dialog.innerHTML = `\n      <p class=\"confirm-message\"><\/p>\n      <div class=\"confirm-actions\">\n        <button type=\"button\" class=\"confirm-cancel\">Cancel<\/button>\n        <button type=\"button\" class=\"confirm-ok\">${confirmLabel}<\/button>\n      <\/div>`\n    dialog.querySelector('.confirm-message').textContent = message\n    const close = (result) => {\n      dialog.close()\n      dialog.remove()\n      resolve(result)\n    }\n    dialog.querySelector('.confirm-cancel').addEventListener('click', () => close(false))\n    dialog.querySelector('.confirm-ok').addEventListener('click', () => close(true))\n    dialog.addEventListener('cancel', (event) => {\n      event.preventDefault()\n      close(false)\n    })\n    document.body.append(dialog)\n    dialog.showModal()\n  })\n}\n\nfunction addDebugPanel(section) {\n  const panel = document.createElement('details')\n  panel.className = 'debug-panel'\n  panel.innerHTML = `\n    <summary>Debug: Export / Import<\/summary>\n    <div class=\"debug-actions\">\n      <button type=\"button\" class=\"debug-button\" id=\"export-json\">Export JSON<\/button>\n      <label class=\"debug-button\">Import JSON<input id=\"import-json\" type=\"file\" accept=\"application/json\" hidden /><\/label>\n    <\/div>\n    <pre class=\"debug-status\" id=\"debug-status\"><\/pre>`\n  section.querySelector('.home-scroll').append(panel)\n  const status = panel.querySelector('#debug-status')\n\n  const storage = storageStatus()\n  status.textContent = storage.available\n    ? `Storage: ok · ${storage.keys.length} entries · ${(storage.bytes / 1024).toFixed(0)} kB\n${storage.keys.map((entry) => `  ${entry.key}: ${(entry.bytes / 1024).toFixed(1)} kB`).join('\\n')}`\n    : `Storage NOT available (${storage.error}) — data will not survive closing the app.\\nTurn off private mode or \"Block All Cookies\".`\n\n  // Which cache version the device is running — the quickest way to tell a stale\n  // home-screen install from a real regression.\n  status.textContent += `\\nHome-screen app: ${isStandalone() ? 'yes' : 'no'} · Device: ${platform()}`\n\n  if ('serviceWorker' in navigator) {\n    navigator.serviceWorker\n      .getRegistration()\n      .then((registration) => {\n        const worker = registration?.active\n        status.textContent += `\\nService worker: ${worker ? worker.state : registration ? 'installing' : 'none'}`\n      })\n      .catch(() => {})\n  }\n\n  if ('caches' in window) {\n    caches\n      .keys()\n      .then((keys) => {\n        status.textContent += `\\nCaches: ${keys.join(', ') || '—'}`\n      })\n      .catch(() => {})\n  }\n\n  panel.querySelector('#export-json').addEventListener('click', () => {\n    const dump = {}\n    for (let index = 0; index < localStorage.length; index++) {\n      const key = localStorage.key(index)\n      if (key?.startsWith('poc.')) dump[key] = localStorage.getItem(key)\n    }\n    const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' })\n    const link = document.createElement('a')\n    link.href = URL.createObjectURL(blob)\n    link.download = 'wellpass-state.json'\n    link.click()\n    setTimeout(() => URL.revokeObjectURL(link.href), 1000)\n    status.textContent = `Exported: ${Object.keys(dump).length} entries`\n  })\n\n  panel.querySelector('#import-json').addEventListener('change', async (event) => {\n    const file = event.target.files?.[0]\n    if (!file) return\n    try {\n      const data = JSON.parse(await file.text())\n      let count = 0\n      for (const [key, value] of Object.entries(data)) {\n        if (!key.startsWith('poc.') || typeof value !== 'string') continue\n        localStorage.setItem(key, value)\n        count++\n      }\n      status.textContent = `Imported: ${count} entries — reloading …`\n      setTimeout(() => location.reload(), 600)\n    } catch (error) {\n      status.textContent = `Import failed: ${error.message}`\n    }\n  })\n}\n\nexport function unmount() {\n  state = null\n}\n","views/checkin.js":"import { normalize } from '../categories.js'\r\nimport { Profile, studioStore } from '../stores.js'\r\nimport { loadSelfie } from '../selfie.js'\r\nimport { formatTimestamp, initialsFor, stripCitySuffix } from '../format.js'\r\nimport { backdropMarkup } from '../checkin-backdrop.js'\r\n\r\n// Dynamic layer geometry, expressed as fractions of the screen height.\r\nexport const DEFAULT_NAME = 'Oğlum McDoglum'\r\nexport const DEFAULT_LOCATION = 'Holmes Place Potsdamer Platz'\r\n\r\n// The disc grows by this fraction of the frame width, see syncPulse().\r\nconst PULSE_EXPAND_WIDTH_FRACTION = 0.1\r\nconst AVATAR_SIZE = 0.2305\r\nconst STAGE_RATIO = 9 / 16\r\n\r\nlet onResize = null\r\n\r\nfunction locationText(profile) {\r\n  const studio = studioStore.studio(profile.locationID)\r\n  if (studio && studio.name === profile.location) return stripCitySuffix(studio.name, studio.city)\r\n  return profile.location || DEFAULT_LOCATION\r\n}\r\n\r\nexport function mount(root, { navigate } = {}) {\r\n  const profile = Profile.snapshot()\r\n  const name = profile.name.trim() || DEFAULT_NAME\r\n  const category = normalize(profile.category || 'Fitness')\r\n  const timestamp = formatTimestamp(profile.timestamp ?? Date.now())\r\n  const selfie = loadSelfie()\r\n\r\n  const section = document.createElement('section')\r\n  section.id = 'checkin'\r\n  section.className = 'screen'\r\n  section.innerHTML = `\r\n    <div class=\"ci-stage\">\r\n      ${backdropMarkup()}\r\n      <button type=\"button\" class=\"ci-back\" aria-label=\"Back\"><\/button>\r\n    <\/div>\r\n\r\n    <div class=\"ci-overlay\">\r\n      <span class=\"ci-pulse\" aria-hidden=\"true\"><\/span>\r\n      <span class=\"ci-avatar\">\r\n        <span class=\"ci-initials\"><\/span>\r\n        ${selfie ? '<img class=\"ci-photo\" alt=\"\" />' : ''}\r\n      <\/span>\r\n      <p class=\"ci-text ci-name\"><\/p>\r\n      <p class=\"ci-text ci-meta ci-location\"><\/p>\r\n      <p class=\"ci-text ci-meta ci-activity\"><\/p>\r\n      <p class=\"ci-text ci-meta ci-datetime\"><\/p>\r\n    <\/div>`\r\n\r\n  section.querySelector('.ci-name').textContent = name\r\n  section.querySelector('.ci-location').textContent = locationText(profile)\r\n  section.querySelector('.ci-activity').textContent = category\r\n  section.querySelector('.ci-datetime').textContent = timestamp\r\n  section.querySelector('.ci-initials').textContent = initialsFor(name)\r\n\r\n  const image = section.querySelector('.ci-photo')\r\n  if (image) {\r\n    image.src = selfie\r\n    image.addEventListener('error', () => image.remove())\r\n  }\r\n\r\n  section.querySelector('.ci-back').addEventListener('click', () => {\r\n    if (window.history.state?.pwa) window.history.back()\r\n    else if (navigate) navigate('/app/', { replace: true })\r\n    else window.location.assign('/app/')\r\n  })\r\n\r\n  root.append(section)\r\n\r\n  // Scale = (avatar + 10 % of the frame width) / avatar. Frame width is the screen width, capped at the\r\n  // stage width so wide desktop windows don't get a huge pulse.\r\n  const syncPulse = () => {\r\n    const height = section.clientHeight\r\n    if (!height) return\r\n    const avatar = height * AVATAR_SIZE\r\n    const frameWidth = Math.min(section.clientWidth || window.innerWidth, height * STAGE_RATIO)\r\n    section.style.setProperty('--pulse-scale', ((avatar + PULSE_EXPAND_WIDTH_FRACTION * frameWidth) / avatar).toFixed(4))\r\n  }\r\n  syncPulse()\r\n  onResize = syncPulse\r\n  window.addEventListener('resize', onResize)\r\n}\r\n\r\nexport function unmount() {\r\n  if (onResize) window.removeEventListener('resize', onResize)\r\n  onResize = null\r\n}\r\n","views/add-location.js":"import { ALL, symbol } from '../categories.js'\nimport { icon } from '../icons.js'\n\n// Category → icon token lives in categories.js so Home, the dialog and Check-in agree.\nconst categoryIcon = symbol\n\nexport function openAddLocationDialog(onSave) {\n  let category = 'Fitness'\n  const dialog = document.createElement('dialog')\n  dialog.className = 'add-location-dialog'\n  dialog.innerHTML = `\n    <div class=\"dialog-head\">\n      <h2>Add location<\/h2>\n      <button type=\"button\" class=\"dialog-close\" aria-label=\"Close\">${icon('x-circle', 22, { strokeWidth: 2 })}<\/button>\n    <\/div>\n    <div class=\"dialog-body\">\n      <label class=\"field-label\" for=\"new-location-name\">Name<\/label>\n      <input id=\"new-location-name\" class=\"dialog-input\" type=\"text\"\n             placeholder=\"e.g. Fitness First Berlin - Mitte\" autocomplete=\"off\" spellcheck=\"false\" />\n      <span class=\"field-label dialog-category-label\">Category<\/span>\n      <div class=\"category-options\" role=\"radiogroup\" aria-label=\"Category\"><\/div>\n    <\/div>\n    <div class=\"dialog-actions\">\n      <button type=\"button\" class=\"dialog-cancel\">Cancel<\/button>\n      <button type=\"button\" class=\"dialog-save\" disabled>Save<\/button>\n    <\/div>`\n\n  const nameInput = dialog.querySelector('#new-location-name')\n  const saveButton = dialog.querySelector('.dialog-save')\n  const options = dialog.querySelector('.category-options')\n\n  const renderOptions = () => {\n    options.replaceChildren()\n    for (const option of ALL) {\n      const selected = option === category\n      const button = document.createElement('button')\n      button.type = 'button'\n      button.className = `category-option${selected ? ' is-selected' : ''}`\n      button.setAttribute('role', 'radio')\n      button.setAttribute('aria-checked', String(selected))\n      button.innerHTML = `\n        <span class=\"category-option-icon\">${icon(categoryIcon(option), 15, { strokeWidth: 2.2 })}<\/span>\n        <span>${option}<\/span>\n        <span class=\"category-option-check\">${selected ? icon('check', 16, { strokeWidth: 2.4 }) : ''}<\/span>`\n      button.addEventListener('click', () => {\n        category = option\n        renderOptions()\n      })\n      options.append(button)\n    }\n  }\n\n  const close = () => dialog.close()\n  const save = () => {\n    const name = nameInput.value.trim()\n    if (!name) return\n    onSave(name, category)\n    close()\n  }\n\n  nameInput.addEventListener('input', () => {\n    saveButton.disabled = nameInput.value.trim() === ''\n  })\n  nameInput.addEventListener('keydown', (event) => {\n    if (event.key === 'Enter') save()\n  })\n  dialog.querySelector('.dialog-cancel').addEventListener('click', close)\n  dialog.querySelector('.dialog-close').addEventListener('click', close)\n  saveButton.addEventListener('click', save)\n  dialog.addEventListener('cancel', (event) => {\n    event.preventDefault()\n    close()\n  })\n  dialog.addEventListener('close', () => dialog.remove())\n\n  renderOptions()\n  document.body.append(dialog)\n  dialog.showModal()\n  requestAnimationFrame(() => nameInput.focus())\n  return dialog\n}\n"}</script>
  <script>
    // No server here: modules are served from Blob URLs and routes live in the hash.
    (function () {
      var sources = JSON.parse(document.getElementById('wp-modules').textContent)
      var urls = {}
      function resolve(from, spec) {
        var parts = from.split('/')
        parts.pop()
        spec.split('/').forEach(function (part) {
          if (part === '.' || part === '') return
          if (part === '..') parts.pop()
          else parts.push(part)
        })
        return parts.join('/')
      }
      function url(name) {
        if (urls[name]) return urls[name]
        var body = sources[name]
        if (body == null) throw new Error('Module missing: ' + name)
        body = body.replace(/from\s+'([^']+)'/g, function (_, spec) {
          return "from '" + url(resolve(name, spec)) + "'"
        })
        return (urls[name] = URL.createObjectURL(new Blob([body], { type: 'text/javascript' })))
      }
      window.__WELLPASS_SINGLE_FILE__ = true
      import(url('main.js')).catch(function (error) {
        console.error(error)
        document.getElementById('root').textContent =
          'App could not be loaded: ' + (error && error.message ? error.message : error)
      })
    })()
  </script>
