    <style>
/* Design tokens — 1:1 port of ios/OSCwellPassPoC/Theme.swift (live light + html blocks). */
:root {
  /* light UI — Home + Check-in */
  --page-light: #f6f6f6;
  --light-bg: #fbfafa;
  --hairline: #e4e4e4;
  --home-bg: #f2f3f4;
  --card-bg: #ffffff;
  --card-stroke: #e8e8e8;
  --nav-grey: #757575;
  --headline-teal: #2c6e73;
  --name-dark: #2a2a2a;
  --meta-grey: #9a9a9a;
  --arc-teal: #4e828d;
  --arc-wash: #eef1f4;
  --photo-placeholder: #e7eff0;
  --ring-sage: #b7c0ba;
  --ring-green: #8fb79b;
  --line-teal: #48727c;

  /* check-in design source (390×844 canvas) */
  --html-page: #f3f4f4;
  --html-accent: #2e7882;
  --html-ring: #dcebe6;
  --html-photo: #b9d3d6;
  --html-text: #2b2e30;
  --html-meta: #5f666a;
  --html-card-tint: rgba(249, 251, 252, 0.85);
  --html-ink: #141e23;

  /* semantic aliases used by the views */
  --danger: #e5484d;
  --focus-ring: rgba(44, 110, 115, 0.45);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
}

html {
  background: var(--home-bg);
  -webkit-text-size-adjust: 100%;
  /* Home-screen app feel: nothing may be panned sideways and nothing bounces. */
  overflow-x: clip;
  overscroll-behavior: none;
}

body {
  min-height: 100%;
  background: var(--home-bg);
  color: var(--name-dark);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-synthesis: weight;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: clip;
  overscroll-behavior: none;
  /* pan-y + pinch-zoom: no sideways drag, no rubber-band, no double-tap zoom. */
  touch-action: pan-y pinch-zoom;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

/* Text entry still needs selection + the native caret/menu. */
input,
textarea,
select,
[contenteditable="true"] {
  -webkit-user-select: text;
  user-select: text;
  -webkit-touch-callout: default;
}

#root {
  min-height: 100%;
}

/* Screen stage: one layer per mounted view. Both layers coexist only while a
   transition runs (router.js), so the sideways push has something to slide over. */
.screen-stage {
  position: relative;
  min-height: 100dvh;
  /* Clip the incoming layer at the screen edge without becoming a scroll box —
     vertical scrolling stays on the document. */
  overflow-x: clip;
}

.screen-layer {
  position: relative;
  min-height: 100dvh;
  background: var(--home-bg);
}

.screen-layer.is-outgoing {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  pointer-events: none;
}

/* UIKit-style dim that follows the screen being covered/revealed. */
.layer-dim {
  position: absolute;
  inset: 0;
  background: #000;
  opacity: 0;
  pointer-events: none;
}

.screen {
  min-height: 100dvh;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* Horizontal strips (category chips) keep their own pan gesture. */
[data-touch-pan-x] {
  touch-action: pan-x;
}

.icon {
  display: block;
  flex: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

:focus-visible {
  outline: 2px solid var(--headline-teal);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.001ms !important;
  }
}

#home {
  background: var(--home-bg);
  color: var(--name-dark);
}

.chrome-spacer {
  height: 64px;
}

.home-scroll {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 8px 20px 32px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.home-header {
  padding-top: 4px;
  min-height: 44px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}

.home-title {
  margin: 0;
  font-size: 30px;
  line-height: 1.12;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--headline-teal);
}

.home-subtitle {
  margin: 2px 0 0;
  font-size: 13.5px;
  line-height: 1.2;
  color: var(--meta-grey);
}

.card {
  background: var(--card-bg);
  border: 1px solid var(--card-stroke);
  border-radius: 16px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
}

/* Install hint ------------------------------------------------------------ */
.install-card {
  overflow: hidden;
  border-color: rgba(44, 110, 115, 0.22);
  background: linear-gradient(180deg, #ffffff 0%, #f7fafb 100%);
}

.install-head {
  width: 100%;
  padding: 12px 14px;
  border: 0;
  background: transparent;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  color: inherit;
  font: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.install-copy {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.install-title {
  font-size: 14.5px;
  line-height: 1.2;
  font-weight: 700;
  color: var(--headline-teal);
}

.install-sub {
  font-size: 12.5px;
  line-height: 1.2;
  color: var(--meta-grey);
}

.install-chevron {
  margin-left: auto;
  display: grid;
  place-items: center;
  color: var(--meta-grey);
}

.install-body {
  padding: 0 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.install-body[hidden] {
  display: none;
}

.install-lead {
  margin: 0;
  font-size: 13px;
  line-height: 1.35;
  color: var(--nav-grey);
}

.install-steps {
  margin: 2px 0 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.install-steps li {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 13.5px;
  line-height: 1.35;
  color: var(--name-dark);
}

.install-steps b {
  font-weight: 600;
}

.install-steps svg {
  display: inline-block;
  vertical-align: -2px;
  color: var(--headline-teal);
}

.install-num {
  flex: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--arc-wash);
  color: var(--headline-teal);
  font-size: 11px;
  font-weight: 700;
  line-height: 18px;
  text-align: center;
}

.install-dismiss {
  align-self: flex-start;
  margin-top: 2px;
  padding: 7px 14px;
  border: 1px solid rgba(44, 110, 115, 0.28);
  border-radius: 999px;
  background: transparent;
  color: var(--headline-teal);
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.install-dismiss:active {
  background: rgba(44, 110, 115, 0.08);
}

/* Selfie ------------------------------------------------------------------ */
.selfie-card {
  width: 100%;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 16px;
  text-align: left;
  cursor: pointer;
  font: inherit;
  color: inherit;
}

.selfie-avatar {
  position: relative;
  flex: none;
  width: 62px;
  height: 62px;
  border: 3px solid var(--ring-sage);
  border-radius: 50%;
  background: var(--photo-placeholder);
  overflow: hidden;
  display: grid;
  place-items: center;
}

.selfie-avatar img,
.selfie-placeholder {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.selfie-avatar img {
  object-fit: cover;
}

.selfie-placeholder {
  display: grid;
  place-items: center;
  color: var(--nav-grey);
}

.selfie-copy {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.selfie-title {
  font-size: 15px;
  line-height: 1.2;
  font-weight: 600;
  color: var(--name-dark);
}

.selfie-sub {
  font-size: 13.5px;
  line-height: 1.2;
  color: var(--meta-grey);
}

.selfie-chevron {
  margin-left: auto;
  color: var(--meta-grey);
}

/* Name -------------------------------------------------------------------- */
.name-card {
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field-label {
  font-size: 12.5px;
  line-height: 1.2;
  font-weight: 600;
  color: var(--meta-grey);
}

.name-input {
  width: 100%;
  border: 0;
  padding: 0;
  background: transparent;
  font-size: 18px;
  line-height: 1.2;
  font-weight: 600;
  color: var(--name-dark);
  caret-color: var(--headline-teal);
  outline: none;
}

.name-input::placeholder {
  color: var(--meta-grey);
  opacity: 0.72;
}

/* Location ---------------------------------------------------------------- */
.location-card {
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.location-label-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}

.add-location {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--headline-teal);
  font-size: 12.5px;
  line-height: 1.2;
  font-weight: 600;
  cursor: pointer;
}

.search-pill {
  height: 42px;
  border: 1px solid var(--card-stroke);
  border-radius: 11px;
  background: var(--home-bg);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  color: var(--meta-grey);
}

.search-pill:focus-within {
  border-color: var(--focus-ring);
}

.search-pill input {
  flex: 1;
  min-width: 0;
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--name-dark);
  /* ≥16px: below that iOS Safari zooms the whole page on focus and leaves it
     pannable sideways afterwards. */
  font-size: 16px;
  line-height: 1.2;
  outline: none;
  caret-color: var(--headline-teal);
  -webkit-appearance: none;
  appearance: none;
}

.search-pill input::placeholder {
  color: var(--meta-grey);
  opacity: 0.82;
}

.search-pill input::-webkit-search-cancel-button {
  display: none;
}

.search-clear {
  flex: none;
  display: inline-grid;
  place-items: center;
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--meta-grey);
  cursor: pointer;
}

.chips {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 1px 0;
  scrollbar-width: none;
  -ms-overflow-style: none;
  /* vertical drags stay with the page; only this strip pans sideways */
  touch-action: pan-x;
}

.chips::-webkit-scrollbar {
  display: none;
}

.chip {
  flex: none;
  height: 30px;
  padding: 0 10px;
  border: 1px solid var(--card-stroke);
  border-radius: 999px;
  background: var(--home-bg);
  color: var(--name-dark);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12.5px;
  line-height: 1;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
}

.chip.is-selected {
  background: var(--headline-teal);
  border-color: transparent;
  color: #fff;
}

.chip .icon {
  width: 10.5px;
  height: 10.5px;
}

.results {
  border-radius: 12px;
  background: var(--home-bg);
  overflow: hidden;
}

.results-empty {
  margin: 0;
  padding: 10px 12px;
  font-size: 13.5px;
  line-height: 1.3;
  color: var(--meta-grey);
}

.studio-row {
  width: 100%;
  border: 0;
  background: transparent;
  padding: 8.5px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  color: inherit;
  font: inherit;
  cursor: pointer;
  touch-action: pan-y;
  -webkit-touch-callout: none;
  user-select: none;
  position: relative;
  z-index: 1;
  background: var(--home-bg);
  transition: transform 180ms ease;
  will-change: transform;
}

.results > * + .studio-row,
.results > * + .studio-swipe {
  border-top: 1px solid var(--card-stroke);
}

.studio-swipe {
  position: relative;
  overflow: hidden;
}

.studio-delete {
  position: absolute;
  inset: 0 0 0 auto;
  width: 88px;
  border: 0;
  padding: 0;
  background: var(--danger);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.1px;
  cursor: pointer;
}

.studio-swipe.is-open .studio-row {
  transform: translateX(-88px);
}

.studio-icon,
.history-icon {
  flex: none;
  width: 22px;
  display: grid;
  place-items: center;
  color: var(--headline-teal);
}

.studio-copy {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
  flex: 1;
}

.studio-name {
  font-size: 14.5px;
  line-height: 1.2;
  font-weight: 500;
  color: var(--name-dark);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.studio-category {
  font-size: 12px;
  line-height: 1.2;
  color: var(--meta-grey);
}

.studio-check {
  flex: none;
  color: var(--headline-teal);
}

.studio-check.is-hidden {
  visibility: hidden;
}

.selected-card {
  border-radius: 12px;
  background: var(--home-bg);
  padding: 9px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.selected-name {
  font-size: 15.5px;
  line-height: 1.2;
  font-weight: 600;
  color: var(--name-dark);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.location-empty {
  width: 100%;
  border: 0;
  padding: 12px 0;
  background: transparent;
  text-align: left;
  color: var(--meta-grey);
  font-size: 13.5px;
  line-height: 1.3;
  cursor: pointer;
}

/* Actions ----------------------------------------------------------------- */
.checkin-button {
  margin-top: 2px;
  width: 100%;
  height: 52px;
  border: 0;
  border-radius: 14px;
  background: var(--headline-teal);
  color: #fff;
  font-size: 17px;
  line-height: 1;
  font-weight: 600;
  cursor: pointer;
}

.checkin-button:active {
  filter: brightness(0.95);
}

/* History ----------------------------------------------------------------- */
.history-card {
  overflow: hidden;
}

.history-head {
  width: 100%;
  height: 48px;
  padding: 0 14px;
  border: 0;
  background: transparent;
  display: flex;
  align-items: center;
  gap: 8px;
  color: inherit;
  font: inherit;
  cursor: pointer;
}

.history-title {
  font-size: 15px;
  line-height: 1.2;
  font-weight: 600;
  color: var(--name-dark);
}

.history-count {
  min-width: 20px;
  padding: 2px 7px;
  border-radius: 999px;
  background: rgba(44, 110, 115, 0.12);
  color: var(--headline-teal);
  font-size: 12px;
  line-height: 1.2;
  font-weight: 600;
  text-align: center;
}

.history-chevron {
  margin-left: auto;
  color: var(--meta-grey);
}

.history-body[hidden] {
  display: none;
}

.history-empty {
  margin: 0;
  padding: 14px;
  font-size: 13.5px;
  color: var(--meta-grey);
}

.history-row {
  padding: 9px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.history-row + .history-row {
  border-top: 1px solid var(--card-stroke);
}

.history-copy {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.history-studio {
  font-size: 14px;
  line-height: 1.2;
  font-weight: 500;
  color: var(--name-dark);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.history-date {
  font-size: 12px;
  line-height: 1.2;
  color: var(--meta-grey);
}

.history-category {
  flex: none;
  font-size: 11.5px;
  line-height: 1.2;
  font-weight: 600;
  color: var(--meta-grey);
}

.history-divider {
  height: 1px;
  background: var(--card-stroke);
}

.history-clear {
  width: 100%;
  height: 42px;
  border: 0;
  background: transparent;
  color: rgba(229, 72, 77, 0.85);
  font-size: 13px;
  line-height: 1;
  font-weight: 600;
  cursor: pointer;
}

/* Add-location dialog ----------------------------------------------------- */
dialog {
  color: var(--name-dark);
}

.add-location-dialog {
  width: min(420px, calc(100vw - 32px));
  max-height: min(720px, calc(100dvh - 48px));
  padding: 0;
  border: 1px solid var(--card-stroke);
  border-radius: 20px;
  background: var(--card-bg);
  box-shadow: 0 20px 60px rgba(20, 30, 35, 0.18);
  overflow: hidden;
}

.add-location-dialog::backdrop,
.confirm-dialog::backdrop {
  background: rgba(20, 30, 35, 0.36);
}

.dialog-head {
  padding: 16px 18px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--card-stroke);
}

.dialog-head h2 {
  margin: 0;
  font-size: 18px;
  line-height: 1.2;
  font-weight: 700;
  color: var(--headline-teal);
}

.dialog-close {
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--meta-grey);
  cursor: pointer;
}

.dialog-body {
  padding: 16px 18px;
  overflow-y: auto;
  max-height: calc(100dvh - 220px);
  display: flex;
  flex-direction: column;
}

.dialog-input {
  width: 100%;
  height: 44px;
  margin-top: 6px;
  padding: 0 12px;
  border: 1px solid var(--card-stroke);
  border-radius: 11px;
  background: var(--home-bg);
  color: var(--name-dark);
  font-size: 16px;
  outline: none;
}

.dialog-input:focus {
  border-color: var(--focus-ring);
}

.dialog-category-label {
  margin-top: 18px;
}

.category-options {
  margin-top: 6px;
  border: 1px solid var(--card-stroke);
  border-radius: 12px;
  overflow: hidden;
}

.category-option {
  width: 100%;
  height: 42px;
  padding: 0 12px;
  border: 0;
  background: transparent;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--name-dark);
  font-size: 15px;
  text-align: left;
  cursor: pointer;
}

.category-option + .category-option {
  border-top: 1px solid var(--card-stroke);
}

.category-option-icon {
  width: 22px;
  color: var(--headline-teal);
}

.category-option-check {
  margin-left: auto;
  color: var(--headline-teal);
}

.category-option.is-selected {
  background: rgba(44, 110, 115, 0.06);
  font-weight: 600;
}

.dialog-actions {
  padding: 12px 18px 16px;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  border-top: 1px solid var(--card-stroke);
}

.dialog-cancel,
.dialog-save {
  height: 40px;
  padding: 0 16px;
  border-radius: 11px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.dialog-cancel {
  border: 1px solid var(--card-stroke);
  background: var(--card-bg);
  color: var(--name-dark);
}

.dialog-save {
  border: 0;
  background: var(--headline-teal);
  color: #fff;
}

.dialog-save:disabled {
  opacity: 0.42;
  cursor: default;
}

/* Confirm dialog ---------------------------------------------------------- */
.confirm-dialog {
  width: min(360px, calc(100vw - 40px));
  padding: 20px;
  border: 1px solid var(--card-stroke);
  border-radius: 18px;
  background: var(--card-bg);
  box-shadow: 0 20px 60px rgba(20, 30, 35, 0.2);
}

.confirm-message {
  margin: 0 0 18px;
  font-size: 16px;
  line-height: 1.35;
  color: var(--name-dark);
}

.confirm-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.confirm-cancel,
.confirm-ok {
  height: 38px;
  padding: 0 14px;
  border-radius: 10px;
  font-size: 14.5px;
  font-weight: 600;
  cursor: pointer;
}

.confirm-cancel {
  border: 1px solid var(--card-stroke);
  background: var(--card-bg);
  color: var(--name-dark);
}

.confirm-ok {
  border: 0;
  background: var(--danger);
  color: #fff;
}

/* Debug ------------------------------------------------------------------- */
.debug-panel {
  padding: 12px 14px;
  border: 1px dashed var(--card-stroke);
  border-radius: 14px;
  color: var(--meta-grey);
  font-size: 12.5px;
}

.debug-panel summary {
  cursor: pointer;
  font-weight: 600;
}

.debug-actions {
  display: flex;
  gap: 10px;
  margin: 10px 0;
}

.debug-button {
  padding: 8px 12px;
  border: 1px solid var(--card-stroke);
  border-radius: 9px;
  background: var(--card-bg);
  color: var(--headline-teal);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
}

.debug-status {
  margin: 0;
  white-space: pre-wrap;
  font-size: 11.5px;
}

#checkin {
  /* pulse-ring tone, sampled off specs/refs/anim-ref.mov (a little deeper than
     --ring-green, which is the pale colour of the disc) */
  --pulse-green: #7ca18d;
  /* design canvas is 390 wide; cap the scale on desktop */
  --k: calc(min(100vw, 430px) / 390);
  position: relative;
  width: 100%;
  height: 100dvh;
  padding: 0;
  overflow: hidden;
  background: var(--html-page);
  color: var(--html-text);
}

.checkin-stripe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.checkin-layout {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 430px;
  height: 100%;
  margin: 0 auto;
  /* A native nav bar starts at the safe-area top. The 54 from the 390×844 canvas
     already includes the status bar, so adding it here floated the back chevron
     ~55 px too low in a home-screen app. */
  padding-top: calc(2 * var(--k) + env(safe-area-inset-top, 0px));
  padding-bottom: max(calc(34 * var(--k)), env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
}

/* Header ------------------------------------------------------------------ */
.checkin-header {
  flex: none;
  height: calc(44 * var(--k));
  padding: 0 calc(8 * var(--k));
  display: grid;
  grid-template-columns: calc(56 * var(--k)) 1fr calc(56 * var(--k));
  align-items: center;
}

.checkin-header h1 {
  margin: 0;
  text-align: center;
  font-size: calc(17 * var(--k));
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: calc(-0.2 * var(--k));
  color: var(--html-text);
}

.checkin-back {
  justify-self: start;
  width: calc(44 * var(--k));
  height: calc(44 * var(--k));
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--html-text);
  display: grid;
  place-items: center;
  cursor: pointer;
}

.checkin-back .icon {
  width: calc(22 * var(--k));
  height: calc(22 * var(--k));
}

/* Card -------------------------------------------------------------------- */
.checkin-main {
  flex: 1;
  min-height: 0;
  padding: calc(14 * var(--k)) calc(12 * var(--k)) 0;
  display: flex;
  flex-direction: column;
}

.checkin-card {
  flex: 1;
  min-height: 0;
  position: relative;
  border-radius: calc(22 * var(--k));
  border: 1px solid rgba(255, 255, 255, 0.9);
  background: var(--html-card-tint);
  -webkit-backdrop-filter: blur(calc(10 * var(--k))) saturate(0.55) hue-rotate(12deg);
  backdrop-filter: blur(calc(10 * var(--k))) saturate(0.55) hue-rotate(12deg);
  box-shadow:
    0 calc(1 * var(--k)) calc(2 * var(--k)) rgba(20, 30, 35, 0.05),
    0 calc(12 * var(--k)) calc(32 * var(--k)) rgba(20, 30, 35, 0.08);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 calc(24 * var(--k));
}

@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .checkin-card {
    background: #f7fafb;
  }
}

.checkin-content {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.checkin-headline {
  margin: 0 0 calc(22 * var(--k));
  font-size: calc(31 * var(--k));
  line-height: 1.06;
  font-weight: 700;
  letter-spacing: calc(-0.6 * var(--k));
  color: var(--html-accent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

/* Photo disc -------------------------------------------------------------- */
.photo-wrap {
  position: relative;
  flex: none;
  width: calc(228 * var(--k));
  height: calc(228 * var(--k));
  display: grid;
  place-items: center;
}

/* The only motion on this screen: a solid sage ring that grows out from under
   the selfie and fades in place. Measured frame by frame off specs/refs/anim-ref.mov
   (4 cycles, photo edge r = 38.1 px = 100k; see SPEC-09 "Ring pulse"):
   - at rest there is no ring at all (no static disc behind the photo)
   - the ring is a sharp-edged disc behind the photo; its outer edge grows with an
     ease-out-cubic from the photo rim to 119k (scale 1.19) over 0.585 s
   - fully opaque until 0.318 s, then a linear fade to 0 at 0.547 s
   - one cycle = 0.675 s (3 pulses in 2.025 s), so ~0.13 s of nothing between pulses
   - tone rgb(124 161 141) at full strength */
.photo-pulse {
  position: absolute;
  inset: 0;
  margin: auto;
  width: calc(200 * var(--k));
  height: calc(200 * var(--k));
  border-radius: 50%;
  background: var(--pulse-green);
  opacity: 0;
  transform: scale(1);
  will-change: transform, opacity;
  animation:
    checkinRingGrow 0.675s infinite,
    checkinRingFade 0.675s linear infinite;
}

@media (prefers-reduced-motion: reduce) {
  .photo-pulse {
    animation: none;
    opacity: 0;
  }
}

.photo-inner {
  position: relative;
  width: calc(200 * var(--k));
  height: calc(200 * var(--k));
  border-radius: 50%;
  background: var(--html-photo);
  display: grid;
  place-items: center;
  overflow: hidden;
}

.photo-initials {
  font-size: calc(64 * var(--k));
  line-height: 1;
  font-weight: 600;
  letter-spacing: calc(-1 * var(--k));
  color: var(--html-accent);
}

.photo-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Text rows --------------------------------------------------------------- */
.checkin-name,
.checkin-meta {
  max-width: 100%;
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.checkin-name {
  margin-top: calc(20 * var(--k));
  font-size: calc(26 * var(--k));
  line-height: 1.08;
  font-weight: 700;
  letter-spacing: calc(-0.4 * var(--k));
  color: var(--html-text);
}

.checkin-meta {
  font-size: calc(16 * var(--k));
  line-height: 1.2;
  color: var(--html-meta);
}

.checkin-studio {
  margin-top: calc(12 * var(--k));
}

.checkin-category,
.checkin-timestamp {
  margin-top: calc(10 * var(--k));
}

/* Footer ------------------------------------------------------------------ */
.checkin-footer {
  flex: none;
  padding-top: calc(26 * var(--k));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(2 * var(--k));
}

/* The footer wordmarks are static: any scale here grows the box past the
   viewport and makes the page pannable sideways. */

.footer-egym,
.footer-wellpass {
  display: flex;
  align-items: center;
  color: var(--html-text);
  font-weight: 600;
}

.footer-egym {
  height: calc(14 * var(--k));
  font-size: calc(15 * var(--k));
  letter-spacing: calc(1.2 * var(--k));
}

.footer-wellpass {
  height: calc(26 * var(--k));
  font-size: calc(20 * var(--k));
  letter-spacing: calc(0.8 * var(--k));
}

@keyframes checkinRingGrow {
  0% {
    transform: scale(1);
    animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1);
  }
  86.67%,
  100% {
    transform: scale(1.19);
  }
}

@keyframes checkinRingFade {
  0%,
  47.11% {
    opacity: 1;
  }
  81.04%,
  100% {
    opacity: 0;
  }
}

  <script id="wp-modules" type="application/json">{"main.js":"import { start } from './router.js'\nimport { runSelfTest, isSelfTestRequested, shouldKeepSelfTestHistory } from './selftest.js'\n\nconst root = document.getElementById('root')\nif (!root) throw new Error('#root fehlt')\n\nstart(root)\n\nif (isSelfTestRequested()) {\n  runSelfTest({ keep: shouldKeepSelfTestHistory() }).catch((error) => console.error('Self-test failed:', error))\n}\n\nif ('serviceWorker' in navigator) {\n  if (window.isSecureContext) {\n    window.addEventListener('load', () => {\n      navigator.serviceWorker.register('/app/sw.js', { scope: '/app/' }).catch((error) => {\n        console.warn('Service Worker konnte nicht registriert werden:', error)\n      })\n    })\n  } else {\n    console.info('Offline-Cache deaktiviert: Service Worker braucht HTTPS oder localhost.')\n  }\n}\n","router.js":"// pushState router with one popstate listener, one layer per screen, and native-feeling\n// transitions (see transition.js). The outgoing layer stays in the DOM until its\n// animation settles so the push/pop can slide both screens at once.\nimport * as home from './views/home.js'\nimport * as checkin from './views/checkin.js'\nimport { platform, runScreenTransition } from './transition.js'\n\nconst ROUTES = [\n  { pattern: /^\\/app\\/?$/, view: home, name: 'home' },\n  { pattern: /^\\/app\\/checkin\\/?$/, view: checkin, name: 'checkin' },\n]\n\n// The single-file build (`npm run build:single`) is opened from file:// and has no\n// server, so it keeps the same routes in the hash instead of the path.\nconst SINGLE_FILE = typeof window !== 'undefined' && window.__WELLPASS_SINGLE_FILE__ === true\n\nlet stage = null\nlet current = null\nlet currentLayer = null\nlet currentDepth = 0\n\nfunction currentPath() {\n  if (!SINGLE_FILE) return location.pathname\n  const hash = location.hash.replace(/^#/, '')\n  return hash.startsWith('/app') ? hash : '/app/'\n}\n\nfunction matchRoute(pathname) {\n  return ROUT // M3 \"emphasized decelerate\"\nconst EASE_DESKTOP = 'cubic-bezier(0.4, 0, 0.2, 1)';\n\nexport function platform() {\n  const ua = typeof navigator === 'undefined' ? '' : navigator.userAgent;\n  if (/Android/i.test(ua)) return 'android';\n  if (/iPhone|iPad|iPod/i.test(ua)) return 'ios';\n  // iPadOS 13+ claims to be a Mac; a touch-capable Mac is an iPad in disguise.\n  if (/Macintosh/i.test(ua) && (navigator.maxTouchPoints ?? 0) > 1) return 'ios';\n  return 'desktop';\n}\n\nfunction prefersReducedMotion() {\n  return window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches === true;\n}\n\nconst translate = (x, y = 0) => `translate3d(${x}, ${y}, 0)`;\n\nfunction iosPlan(direction) {\n  const forward = direction !== 'back';\n  const shadow = (x) => `${x}px 0 26px -14px rgba(0, 0, 0, 0.34)`;\n  const clear = (x) => `${x}px 0 26px -14px rgba(0, 0, 0, 0)`;\n  const seam = forward ? -18 : 18;\n  return {\n    duration: 420,\n    easing: EASE_IOS,\n    incoming: [\n      { transform: translate(forward ? '100%' : '-30%'), boxShadow: shadow(seam) },\n      { transform: translate(0), boxShadow: clear(seam) },\n    ],\n    outgoing: [\n      { transform: translate(0) },\n      { transform: translate(forward ? '-30%' : '100%') },\n    ],\n    // UIKit dims the view underneath a push — and the revealed one while popping.\n    incomingDim: forward ? [0, 0] : [0.14, 0],\n    outgoingDim: forward ? [0, 0.14] : [0, 0],\n  };\n}\n\nfunction androidPlan(direction) {\n  const forward = direction !== 'back';\n  return {\n    duration: 300,\n    easing: EASE_ANDROID,\n    incoming: [\n      { transform: translate(forward ? 28 : -28), opacity: 0 },\n      { transform: translate(0), opacity: 1 },\n    ],\n    outgoing: [\n      { transform: translate(0), opacity: 1 },\n      { transform: translate(forward ? -14 : 14), opacity: 0 },\n    ],\n    incomingDim: [0, 0],\n    outgoingDim: [0, 0],\n  };\n}\n\nfunction desktopPlan(direction) {\n  return {\n    duration: 200,\n    easing: ring(raw ?? '').trim()\n  if (!s) return 'Sonstiges'\n  if (s.toLowerCase() === 'fitnessstudio') return 'Fitness'\n  return ALL.find((category) => category.toLowerCase() === s.toLowerCase()) ?? s\n}\n\n/** Web icon token per category (renderer lives in the views). */\nexport const SYMBOLS = {\n  Fitness: 'dumbbell',\n  Wellness: 'leaf',\n  Outdoor: 'person-hiking',\n  Yoga: 'lotus',\n  Pilates: 'mat-stretch',\n  Bouldern: 'climbing-hold',\n  Kampfsport: 'boxing-glove',\n  Tanz: 'dancing-figure',\n  EMS: 'bolt',\n  CrossFit: 'barbell',\n  Physio: 'physio',\n  Racket: 'racket',\n  Wassersport: 'paddle',\n  Cycling: 'bike',\n  Sonstiges: 'map-pin',\n}\n\nexport function symbol(category) {\n  return SYMBOLS[category] ?? SYMBOLS.Sonstiges\n}\n","icons.js":"// Inline SVG icon set — no CDN. Category tokens match BUILD.md §6.\nconst ICONS = {\n  dumbbell: '<path d=\"M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12\"/>',\n  leaf: '<path d=\"M20 4C12 4 5 8 5 15a5 5 0 0 0 5 5c7 0 10-8 10-16Z\"/><path d=\"M5 20c2-6 6-9 11-11\"/>',\n  'person-hiking': '<circle cx=\"13\" cy=\"4\" r=\"2\"/><path d=\"M10 22l2-6 3 2 2 4M11 9l-2 7 4 1 2-5-3-2-1-1Z\"/>',\n  'climbing-hold': '<path d=\"M7 21l1-7 3 1 1-5 3 1-1 5 3-2 1 4-4 3Z\"/><path d=\"M8 14l-3-2M16 10l2-3\"/>',\n  'boxing-glove': '<path d=\"M7 21h10v-4l2-4V7a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v6l2 4v4Z\"/><path d=\"M7 10h10\"/>',\n  'dancing-figure': '<circle cx=\"13\" cy=\"4\" r=\"2\"/><path d=\"M12 7l-3 5 4 2 2-4M9 12l-3 3M13 14l-2 8M13 14l4 3 2 5\"/>',\n  bolt: '<path d=\"M13 2 4 14h7l-1 8 9-12h-7l1-8Z\"/>',\n  barbell: '<path d=\"M4 8v8M20 8v8M7 6v12M17 6v12M7 12h10\"/>',\n  'map-pin': '<path d=\"M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z\"/><circle cx=\"12\" cy=\"10\" r=\"2.5\"/>',\n  lotus: '<path d=\"M12 4c2.3 2.2 3.4 4.3 3.4 6.2a3.4 3.4 0 0 1-6.8 0c0-1.9 1.1-4 3.4-6.2Z\"/><path d=\"M4.6 10.4c1.9-.7 3.6 0 4.8 1.4M19.4 10.4c-1.9-.7-3.6 0-4.8 1.4\"/><path d=\"M3 16.2c2.9 2.6 5.9 3.6 9 3.6s6.1-1 9-3.6\"/>',\n  'mat-stretch': '<circle cx=\"6.2\
